# Data source for the central Prometheus. The uid is pinned because the dashboards name it; change it
# here and every panel loses its data. The uid differs from the hosted box's `cg-prom` on purpose, so
# the two can live in one Grafana without colliding.
#
# timeInterval sets the floor for $__rate_interval, used by this datasource's rate() and
# histogram_quantile() panels -- Cortex's own and context-guru's (receiver port 4319), which both write to
# this Prometheus. Do not lower it below Cortex's metrics_push.interval default (60s,
# core/config/accounting.go): a smaller floor leaves rate() windows with too few samples.

apiVersion: 1

datasources:
  - name: central-prometheus
    uid: central-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 60s
