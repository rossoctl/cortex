# Unit tests for the dashboard ratio queries, run with promtool (simulated time):
#   promtool test rules tests/dashboards_test.yml
# The expressions are the cache and fleet dashboards', with the Grafana variables filled in: $proxy and
# $machine as ".*" (All), $__range as 1h, $__interval as 5m. grafana/test_gen_dashboards.py fails if an expression
# here is not one that gen_dashboards.py writes, so these tests cannot drift from the dashboards.
#
# Why: on 2026-11-19 a ratio divided by clamp_min(<zero>, 1e-9) and showed 1164430250x and
# 25753309759.6%. A zero divisor must show no data, not its numerator times a billion (ratio()).
# The zero divisor itself came from increase() undercounting a counter born inside the selected
# range: it started at 0, but increase() does not know that and extrapolated it to 0 from a flat
# history. inc()'s new_series_fallback fixes that undercount at the source: a series with no
# earlier sample falls back to last_over_time(), which for a counter that started at 0 inside the
# window IS its total.

evaluation_interval: 1m

tests:
  # ---- The 2026-11-19 incident, replayed with the fix -------------------------------------------
  # The same shape of data as the incident: cost_usd is created mid-range, already warm, with no
  # earlier sample at all — increase() alone sees that and undercounts it to 0. estimated_cost_usd
  # carries a real history from before the range (it survived the old build's restart, a counter
  # reset increase() already compensates for on its own). The window is evaluated at 70m, well
  # past its own start, so "offset 1h" cannot mistake "before this synthetic clock began" for
  # "genuinely had no earlier sample" (a different series, below, nails that boundary down).
  - name: a ping-cost counter born inside the range uses its own value, not increase()'s undercount
    interval: 1m
    input_series:
      - series: 'llm_keepalive_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '_x60 0.0137x10'
      - series: 'llm_keepalive_estimated_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '0.0129x10 0.0258x50 0.0137x10'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="saved"}'
        values: '0+0.02x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="added"}'
        values: '0+0.001x69'
    promql_expr_test:
      # Pings that paid: rescue net over the range, divided by the ping cost's own last value
      # (0.0137, its only sample): a real, finite ratio, not "no data" and nowhere near a billion.
      - eval_time: 70m
        expr: '(sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) - sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]))) / ((sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]))) > 0)'
        exp_samples:
          - labels: '{}'
            value: 83.21167883211685
      # Estimated ping cost: the estimated series existed before the window and keeps plain
      # increase() (reset-compensated); the ping-cost series falls back to its last value, 0.0137.
      # Neither reads as a billion-fold ratio.
      - eval_time: 70m
        expr: 'sum((increase(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) / ((sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]))) > 0)'
        exp_samples:
          - labels: '{}'
            value: 1.0169491525423728

  # ---- A counter with real zero activity for the whole range still shows no data ----------------
  # Unlike the series above, this one existed before the window and never changed inside it: the
  # "existed" check is true, increase() runs as normal and legitimately returns 0 (no pings cost
  # anything), and ratio() still turns that zero divisor into no data, not a billion.
  - name: a ping cost that genuinely did not increase still gives no data, not a billion
    interval: 1m
    input_series:
      - series: 'llm_keepalive_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '0.05x61'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="saved"}'
        values: '0+0.02x60'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="added"}'
        values: '0+0.001x60'
    promql_expr_test:
      - eval_time: 60m
        expr: '(sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) - sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]))) / ((sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]))) > 0)'
        exp_samples: []

  # ---- The normal case: the ratios still compute -------------------------------------------------
  # Every series here existed from the start of the window, so the fallback never engages and the
  # ratios are exactly what they were before the fallback was added.
  - name: a ping cost that increased gives the true ratios
    interval: 1m
    input_series:
      - series: 'llm_keepalive_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '0+1x60'
      - series: 'llm_keepalive_estimated_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '0+0.5x60'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="saved"}'
        values: '0+3x60'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",direction="added"}'
        values: '0+1x60'
    promql_expr_test:
      # Pings that paid: (3 - 1) / 1 = 2
      - eval_time: 60m
        expr: '(sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[1h])) - sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[30d] offset 1h)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[1h]))) / ((sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]))) > 0)'
        exp_samples:
          - labels: '{}'
            value: 2
      # Estimated ping cost: 0.5 / 1 = 0.5
      - eval_time: 60m
        expr: 'sum((increase(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_estimated_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) / ((sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 1h)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[1h]))) > 0)'
        exp_samples:
          - labels: '{}'
            value: 0.5

  # ---- A series with no cause label is named, not shown as "Value" ------------------------------
  # An older cortex build pushes llm_cache_misses_total with no cause label; context-guru pushes it with one.
  - name: a miss with no cause label is shown as unattributed
    interval: 1m
    input_series:
      - series: 'llm_cache_misses_total{proxy="cortex",machine="m1",model="m"}'
        values: '0+1x60'
      - series: 'llm_cache_misses_total{proxy="context-guru",machine="m2",model="m",cause="ttl"}'
        values: '0+2x60'
    promql_expr_test:
      - eval_time: 60m
        expr: 'label_replace(sum by (cause)((increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])), "cause", "unattributed", "cause", "")'
        exp_samples:
          - labels: '{cause="unattributed"}'
            value: 5
          - labels: '{cause="ttl"}'
            value: 10

  # ---- One miss is one bar of 1, even on a bar's edge ---------------------------------------------
  # 2026-11-22: rate() * 3600 over $__rate_interval (90 s, three ~30 s bars) drew each miss as three
  # bars of 40/h. Plain increase() over $__interval fixes the triplet but not the count: it reads one
  # miss as 1.11, and loses a step that falls between two bars (a miss at 17:45:30 was in neither).
  # Here the proxy pushes every 30 s and the step is between the 35m00s and 35m30s pushes, so the
  # bar (30m, 35m] has no change in its samples, and neither does (35m, 40m]. anchored takes (35m, 40m]
  # from the last push at or before 35m, so that bar holds the miss, exactly once. The other series
  # is born at 35m30s already holding its first miss, with no 0 before it (a ttl_expiry series,
  # 2026-11-22 17:29:29): anchored has no step to take, and inc()'s new-series fallback counts it.
  - name: a miss between two bars is counted once, as 1
    interval: 30s
    input_series:
      - series: 'llm_cache_misses_total{proxy="cortex",machine="m1",model="m",cause="ttl_expiry"}'
        values: '0x70 1x20'
      - series: 'llm_cache_misses_total{proxy="cortex",machine="m1",model="m",cause="other"}'
        values: '_x71 1x19'
    promql_expr_test:
      - eval_time: 35m
        expr: 'label_replace(sum by (cause)((increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])), "cause", "unattributed", "cause", "")'
        exp_samples:
          - labels: '{cause="ttl_expiry"}'
            value: 0
      - eval_time: 40m
        expr: 'label_replace(sum by (cause)((increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])), "cause", "unattributed", "cause", "")'
        exp_samples:
          - labels: '{cause="ttl_expiry"}'
            value: 1
          - labels: '{cause="other"}'
            value: 1

  # ---- A daily bar is its own day, not the day before ------------------------------------------
  # The 1d step puts a bar at 00:00 UTC. A window that ends there is the previous day: the bar
  # marked 11-22 held 11-21's dollars, and today never showed (2026-11-22, Cache effects).
  # day_bar() looks ahead from the bar. Day 1 (0-24h) saves 1 per hour; day 2 saves 2 per hour
  # until 31h, the last push. The rescue series is born at 26h already holding 5.
  # The 48h evaluation is also there because promtool loads input samples only up to the last
  # eval_time: without it, the window after 24h would be empty here, though not in Prometheus.
  - name: a daily cache-effect bar holds its own day, and today so far
    interval: 1h
    input_series:
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="break",cause="none",direction="saved"}'
        values: '0+1x24 26+2x6'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",cause="none",direction="saved"}'
        values: '_x26 5x5'
    promql_expr_test:
      # The bar at 0h is day 1: 24, with nothing from day 2.
      - eval_time: 0h
        expr: 'sum by (effect)((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[30d])) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d)) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d))'
        exp_samples:
          - labels: '{effect="break"}'
            value: 24
      # The bar at 24h is day 2 so far: break 24 to 38 is 14, and rescue counts its first 5.
      - eval_time: 24h
        expr: 'sum by (effect)((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[30d])) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d)) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d))'
        exp_samples:
          - labels: '{effect="break"}'
            value: 14
          - labels: '{effect="rescue"}'
            value: 5
      # Day 3 has no push yet, so it has no bar.
      - eval_time: 48h
        expr: 'sum by (effect)((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[30d])) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d)) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d))'
        exp_samples: []

  # ---- NET SAVED adds the cache effects and the interaction --------------------------------------
  # accountant docs/metrics/metrics.md, "The net saving": no counter contains another, so the net is
  # the operations plus the cache effects plus the interaction. Before this, the net left out the
  # effects: the keeper's ping (a spend, in added) showed as a cost, and its rescue nowhere.
  # Per hour: ops saved 0.60, ping 0.30, rescue 1.20 saved and 0.06 added, a break 0.12 added,
  # interaction 0.03 saved. Net = 0.60 + 1.20 + 0.03 - (0.30 + 0.06 + 0.12) = 1.35 (the old query: 0.30).
  - name: net saved includes the cache effects and the interaction
    interval: 1m
    input_series:
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="searchfold",kind="rewrite",tier="cache_read"}'
        values: '0+0.01x69'
      - series: 'llm_savings_added_usd_total{proxy="cortex",machine="m1",component="keeper",kind="spend",tier="cache_read"}'
        values: '0+0.005x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",cause="none",direction="saved"}'
        values: '0+0.02x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",cause="none",direction="added"}'
        values: '0+0.001x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="break",cause="none",direction="added"}'
        values: '0+0.002x69'
      - series: 'llm_savings_interaction_usd_total{proxy="cortex",machine="m1",direction="saved"}'
        values: '0+0.0005x69'
    promql_expr_test:
      - eval_time: 70m
        expr: '(((sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]))) or (sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]))) * 0) - ((sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(added_usd|cache_effect_usd|interaction_usd)_total",direction=~"added|"}[1h]))) or (sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]))) * 0))'
        exp_samples:
          - labels: '{}'
            value: 1.350000000000001

  # ---- inc(): a series born inside the range that then resets ------------------------------------
  # Born at 20m with 1, grows to 10, the proxy restarts at 30m, grows again to 39. True total 49.
  # last_over_time() holds only the part since the reset (39). increase() handles the reset and
  # loses only the first sample. inc() takes the larger (2026-11-19, the rescue series).
  - name: a born series that reset counts both parts, not only the part since the reset
    interval: 1m
    input_series:
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="c",kind="rewrite",tier="cache_read"}'
        values: '_x20 1+1x9 0+1x39'
    promql_expr_test:
      - eval_time: 70m
        expr: 'sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]))'
        exp_samples:
          - labels: '{}'
            value: 49.469387755102034

  # ---- inc(): an old series after a push outage at the range start --------------------------------
  # Samples 0..3 at 0-3m, then no push until 20m (a laptop off the VPN), then 15..64. At the range
  # start (10m) the last sample is 7m old, past Prometheus's 5m lookback. inc() still sees it in its
  # 1d lookback, so it keeps increase() (49 and some extrapolation). Treated as born, it read 64:
  # the history from before the range.
  - name: an old series with a push outage at the range start keeps increase()
    interval: 1m
    input_series:
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="c",kind="rewrite",tier="cache_read"}'
        values: '0+1x3 _x16 15+1x49'
    promql_expr_test:
      - eval_time: 70m
        expr: 'sum((increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) and last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[30d] offset 1h)) or (increase({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]) >= last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h])) or last_over_time({proxy=~".*", machine=~".*",__name__=~"llm_savings_(saved_usd|cache_effect_usd|interaction_usd)_total",direction=~"saved|"}[1h]))'
        exp_samples:
          - labels: '{}'
            value: 50.49999999999999

  # ---- One keep-alive ping is dollars in one bar, not a $105/h spike -----------------------------
  # context-guru #1273: the panel was rate(...[$__rate_interval]) * 3600, so one $1.75 ping over a
  # ~1 min window read as $105/h. It is now the dollars in each bar: increase() anchored over
  # $__interval (filled here as 5m, the panel's floor). The ping is between 32m and 33m. The bar at
  # 35m holds it, exactly: 1.75 (plain increase() extrapolated it to the 5 min window, 2.1875). The
  # next bar holds nothing, so the ping is counted once. There is no rescue series at all: rescue must
  # still read 0 and net minus the ping (or vector(0)), not vanish.
  - name: one keep-alive ping shows as its dollars in one bar
    interval: 1m
    input_series:
      - series: 'llm_keepalive_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '1x32 2.75x10'
    promql_expr_test:
      - eval_time: 35m
        expr: '-sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: -1.75
      - eval_time: 40m
        expr: '-sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: 0
      - eval_time: 35m
        expr: '((sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m] anchored) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[30d] offset 5m)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m] anchored) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m])) or vector(0)) - (sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m] anchored) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[30d] offset 5m)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m] anchored) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m])) or vector(0)))'
        exp_samples:
          - labels: '{}'
            value: 0
      - eval_time: 35m
        expr: '(((sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m] anchored) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[30d] offset 5m)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m] anchored) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="saved"}[5m])) or vector(0)) - (sum((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m] anchored) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[30d] offset 5m)) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m] anchored) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m])) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",effect="rescue",direction="added"}[5m])) or vector(0))) - sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m])))'
        exp_samples:
          - labels: '{}'
            value: -1.75

  # ---- A series back after a gap of more than a day is not its lifetime total in one bar -------
  # OLD_LOOKBACK used to be 1d: a series silent for longer than that was misclassified as newly
  # BORN, and the fallback's last_over_time() drew its whole value-since-start as one bar. Widened
  # to 30d (Prometheus's own retention.time), so a series with any sample in the last 30 days
  # stays OLD and keeps trusting increase() (review of #2064).
  - name: a dollar bar back after a day off is 0, not the counter's lifetime value
    interval: 1m
    input_series:
      - series: 'llm_keepalive_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '3x10 _x1450 3x10'
    promql_expr_test:
      # The real panel ("Keep-alive: cost, rescue and net") negates the bar for the stacked chart.
      - eval_time: 1465m
        expr: '-sum((increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_keepalive_cost_usd_total{proxy=~".*", machine=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: 0

  - name: a count bar back after a day off is 0, not the counter's lifetime value
    interval: 1m
    input_series:
      - series: 'llm_cache_misses_total{proxy="cortex",machine="m1",model="m",cause="ttl"}'
        values: '3x10 _x1450 3x10'
    promql_expr_test:
      # The real panel ("Misses by cause") wraps the query in label_replace for unattributed misses.
      - eval_time: 1465m
        expr: 'label_replace(sum by (cause)((increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) and last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[30d] offset 5m)) or (increase(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m] anchored) >= last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])) or last_over_time(llm_cache_misses_total{proxy=~".*", machine=~".*"}[5m])), "cause", "unattributed", "cause", "")'
        exp_samples:
          - labels: '{cause="ttl"}'
            value: 0

  - name: a day bar after a gap of more than a day is that day, not the lifetime total
    interval: 1h
    input_series:
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="break",cause="none",direction="saved"}'
        values: '0+1x40 _x39 40+1x4'
    promql_expr_test:
      - eval_time: 72h
        expr: 'sum by (effect)((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[30d])) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d)) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d))'
        exp_samples:
          - labels: '{effect="break"}'
            value: 4
      # promtool loads input samples only up to the last eval_time in the group; without this,
      # the series' last 4 hours (80h-84h) would not be loaded and the 72h check above would see
      # an empty window instead of the real repro. The bar ahead of 84h (the [84h,108h) window)
      # has no samples of its own yet, so this reads no series, as in the existing 48h case above.
      - eval_time: 84h
        expr: 'sum by (effect)((increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) and last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[30d])) or (increase(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] anchored offset -1d) >= last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d)) or last_over_time(llm_savings_cache_effect_usd_total{proxy=~".*", machine=~".*",direction="saved"}[1d] offset -1d))'
        exp_samples: []

  # ---- Net saved by source: context rewrite and cache management add up to NET SAVED ------------
  # Every kind of series the net holds, each in exactly one source. Per hour (the 1h window reads
  # each 0+cx69 series as 60c):
  #   context rewrite: mask saves 0.60, a model switch (a setting) saves 0.30, summarize's own call
  #     costs 0.15, a break costs 1.80 and a model-change break 0.12. Net 0.60 + 0.30 - 0.15 - 1.80 - 0.12 = -1.17.
  #   cache management: a rescue saves 1.20 and adds 0.06, the keeper's pings cost 0.45, cachesplit's
  #     operation saves 0.30 and its split effect 0.30, the interaction adds 0.06. Net 1.23.
  #   total: -1.17 + 1.23 = 0.06, NET SAVED. Spend 6.00, so the baseline is 6.06.
  - name: the two sources of the net saving add up to NET SAVED
    interval: 1m
    input_series:
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="mask",kind="rewrite",tier="input"}'
        values: '0+0.01x69'
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="model",kind="setting",tier="input"}'
        values: '0+0.005x69'
      - series: 'llm_savings_added_usd_total{proxy="cortex",machine="m1",component="summarize",kind="spend",tier="output"}'
        values: '0+0.0025x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="break",cause="none",direction="added"}'
        values: '0+0.03x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="break",cause="model_changed",direction="added"}'
        values: '0+0.002x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",cause="none",direction="saved"}'
        values: '0+0.02x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="rescue",cause="none",direction="added"}'
        values: '0+0.001x69'
      - series: 'llm_savings_added_usd_total{proxy="cortex",machine="m1",component="keeper",kind="spend",tier="cache_read"}'
        values: '0+0.0075x69'
      - series: 'llm_savings_saved_usd_total{proxy="cortex",machine="m1",component="cachesplit",kind="rewrite",tier="cache_write_5m"}'
        values: '0+0.005x69'
      - series: 'llm_savings_cache_effect_usd_total{proxy="cortex",machine="m1",effect="split",cause="none",direction="saved"}'
        values: '0+0.005x69'
      - series: 'llm_savings_interaction_usd_total{proxy="cortex",machine="m1",direction="added"}'
        values: '0+0.001x69'
      - series: 'llm_inference_cost_usd_total{proxy="cortex",machine="m1",model="m"}'
        values: '0+0.1x69'
    promql_expr_test:
      # NET SAVED and its rate.
