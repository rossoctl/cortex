# OpenTelemetry Collector for the central metrics stack (contrib build, for the transform processor
# and the bearer-token extension).
#
# Each proxy pushes OTLP/JSON over HTTPS. Two things are decided HERE and never taken from the
# sender:
#   1. which proxy sent the data. One receiver for each proxy (4318 Cortex, 4319 context-guru). The
#      `proxy` label is set per pipeline.
#   2. which labels exist. Only machine, preset, service_version and proxy are kept (metrics spec
#      5.6). A sender cannot add a label.
#
# AUTHENTICATION: the Cortex receiver (4318) takes a push with no token, so a default Cortex
# install pushes with no setup. A token it sends is ignored. Anyone who can reach the Route can
# write Cortex series under any `machine` name: `machine` is the sender's claim, as it was with
# the shared token. The context-guru receiver (4319) still requires `Authorization: Bearer
# <token>`, read from /etc/otelcol/tokens/context-guru.txt (Secret `collector-tokens`) once, at
# start: after a token change, run `oc rollout restart deploy/otel-collector`. Tokens for each
# install, binding a token to a machine and mutual TLS are tracked in rossoctl/context-guru#1130.
#
# TLS is terminated in front of this, by the OpenShift router (edge Routes). The receivers listen on
# plain HTTP inside the cluster. See README.md.

extensions:
  bearertokenauth/contextguru:
    scheme: Bearer
    filename: /etc/otelcol/tokens/context-guru.txt
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp/cortex:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/contextguru:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: bearertokenauth/contextguru

processors:
  # First in the chain: a burst from many machines must not stop the collector.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  transform/cortex:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["machine"], attributes["service.instance.id"])
          - keep_keys(attributes, ["machine", "preset", "service.version"])
          - set(attributes["proxy"], "cortex")
      # The scope name and version would become labels. They carry no information here.
      - context: scope
        statements:
          - set(name, "")
          - set(version, "")
      # Prometheus's OTLP receiver turns every data-point attribute into a series label, not only
      # a promoted resource one, so a deny-list of proxy/machine/etc. still lets a sender add any
      # OTHER label it likes (a privacy and cardinality problem: session_id, user_email, ...).
      # Allow-list instead: only the labels context-guru's shared metrics contract defines
      # (docs/metrics/spec.md 5.1-5.5) survive on the point. Everything else, including a forged
      # proxy/machine, is merged away. A label the contract adds later needs adding here too.
      - context: datapoint
        statements:
          - keep_matching_keys(attributes, "^(model|provider|status_class|stream|source|tier|stage|kind|component|effect|cause|direction|result|reason|check|outcome)$")
  transform/contextguru:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["machine"], attributes["service.instance.id"])
          - keep_keys(attributes, ["machine", "preset", "service.version"])
          - set(attributes["proxy"], "context-guru")
      - context: scope
        statements:
          - set(name, "")
          - set(version, "")
      - context: datapoint
        statements:
          - keep_matching_keys(attributes, "^(model|provider|status_class|stream|source|tier|stage|kind|component|effect|cause|direction|result|reason|check|outcome)$")
  batch:
    timeout: 5s

exporters:
  # OTLP into Prometheus's own OTLP receiver, not remote write. Remote write v1 carries no start
  # time, so Prometheus cannot store the 0 a counter starts from, and increase() then loses the
  # first sample of every new series (a new label set, or the first increment after a proxy
  # restart). The OTLP receiver stores that 0 at the point's StartTimeUnixNano
  # (created-timestamp-zero-ingestion, Prometheus 3.7.0 and later, prometheus#16951).
  # Prometheus, not this exporter, turns the resource attributes into labels: see `otlp:` in
  # prometheus.yml.
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics

service:
  extensions: [health_check, bearertokenauth/contextguru]
  pipelines:
    metrics/cortex:
      receivers: [otlp/cortex]
      processors: [memory_limiter, transform/cortex, batch]
      exporters: [otlp_http/prometheus]
    metrics/contextguru:
      receivers: [otlp/contextguru]
      processors: [memory_limiter, transform/contextguru, batch]
      exporters: [otlp_http/prometheus]
  telemetry:
    # The collector's own metrics, for the pipeline alerts. Prometheus scrapes this port.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
