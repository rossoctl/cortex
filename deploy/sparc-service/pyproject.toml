[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rossoctl-sparc-service"
version = "0.1.0"
description = "Rossoctl SPARC reflection service — a thin in-process HTTP wrapper around the SPARC pre-tool reflection component from the agent-lifecycle-toolkit (ALTK)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # The SPARC engine itself, consumed directly from PyPI (no vendoring).
    "agent-lifecycle-toolkit==0.11.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    # ibm-watsonx-ai (from the toolkit) needs httpx<0.29 from 1.3 on. Without this cap,
    # pip keeps httpx 0.29 and goes back to ibm-watsonx-ai 1.2.8, whose pandas<2.2 is
    # built for numpy 1.x and fails to import. Remove it when ibm-watsonx-ai allows 0.29.
    "httpx<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
rossoctl-sparc-service = "sparc_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sparc_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
