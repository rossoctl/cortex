repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # The plans embed unified diffs, whose blank context lines are a lone space.
        exclude: ^docs/superpowers/plans/
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Rewrite AI Co-authored-by trailers to Assisted-By
  - repo: local
    hooks:
      - id: ai-assisted-by-trailer
        name: Replace Co-Authored-By with Assisted-By
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # `files: ^authbridge/` until that tree became the repo root. Inverted to an
      # exclude rather than dropped: the root tests/ tree was never in scope and
      # does not lint or format clean, so dropping the filter would fail the hook
      # on pre-existing findings. Widening to cover tests/ is a separate change.
      - id: ruff
        args: ['--fix']
        exclude: ^tests/
      - id: ruff-format
        exclude: ^tests/
