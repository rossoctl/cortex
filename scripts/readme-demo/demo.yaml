# Storyboard for the cortex README animation.
#
# Regenerate the asset after editing:  go run .
# CI fails if docs/assets/cortex-demo.svg does not match this file.
#
# Every string in the shell act is copied from the real source, not paraphrased.
# The sources are scripts/install.sh (the download line) and agentop setup, which
# install.sh execs: cmd/agentop/cmd_setup.go, cmd/agentop/setup_step_*.go and
# cmd/agentop/checklist. grep a quoted fragment below to find the line it came from,
# rather than trusting a line number here. Most of these strings interpolate a variable
# at source, so grep a literal prefix of one rather than the whole rendered line. Setup's
# lines are the plain-mode output its e2e tests assert (setup_e2e_test.go), with the
# demo's version in place of the tests' v9.9.9.
# If those strings change, change them here too — the demo claims to be cortex.
#
# Plain mode, because a shell act only adds rows. On a real terminal the download line
# is a title and a progress bar, which stay on screen in place of setup's header and its
# "✓ downloaded" row; each ✓ line also shows how long its step took; and the CORTEX logo
# and "v0.9.3 ready in Ns" replace "cortex v0.9.3 ready.". None of that can be drawn
# here without inventing timings.

total: 50s
grid:
  cols: 120
  rows: 34

acts:
  # Acts 1 and 2 of the storyboard are one continuous terminal, because
  # --claude-code adds a "route Claude Code via Cortex" row to setup's one consent
  # screen: the installer asks once, for everything, and routes Claude Code itself.
  # So the consent prompt arrives in the middle of the install, with nothing typed
  # but the y.
  - name: install
    kind: shell
    runtime: 14s
    steps:
      - cmd: "curl -fsSL https://raw.githubusercontent.com/rossoctl/cortex/main/scripts/install.sh | sh -s -- --claude-code"
        out:
          - "Downloading v0.9.3 for darwin/arm64..."
          - "  rosso cortex · installer   v0.9.3 · darwin/arm64"
          - "  ✓ downloaded   24.0 MB · sha256 verified"
          - ""
          - "  This will:"
          - "    install  agentop, cortex         ~/.local/bin"
          - "    add      ~/.local/bin to PATH    ~/.zshrc (2 marked lines)"
          - "    write    the cortex config       ~/.cortex/config.yaml"
          - "    run      the cortex proxy        launchd user agent · 127.0.0.1:47600"
          - "    route    Claude Code via Cortex  ~/.claude/settings.json"
          - ""
          - "  Undo any time: agentop uninstall"
          - ""
          - "  Continue? [Y/n] y"
          - ""
          - "  ✓ installed    agentop, cortex → ~/.local/bin"
          - "  ✓ PATH         ~/.zshrc"
          - "  ✓ config       ~/.cortex/config.yaml"
          - "  ✓ started      launchd user agent · healthy on 127.0.0.1:47600"
          - "  ✓ routed       Claude Code → Cortex"
          - ""
          - "  cortex v0.9.3 ready."
          - ""
          - "  Open a new terminal, then:"
          - ""
          - "    agentop        # watch your agent traffic live"
          - ""
          - "  Undo any time: agentop uninstall"
        # The long pause on the download is the trick that makes an authored
        # sequence read as a machine doing work rather than a text dump. Setup prints
        # its header and the whole consent screen at once, then each ✓ as its step
        # ends; the wait for /healthz is the long one.
        slow:
          - 150ms
          - 2400ms
          - 30ms
          - 30ms
          - 250ms
          - 40ms
          - 40ms
          - 40ms
          - 40ms
          - 40ms
          - 30ms
          - 30ms
          - 30ms
          - 1200ms
          - 30ms
          - 300ms
          - 150ms
          - 250ms
          - 1300ms
          - 250ms
          - 30ms
          - 120ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms

  # Three Claude Code sessions, one per working directory. These are the same
  # three the next act opens on: agentop names sessions from Claude Code metadata,
  # so the reader should recognise them by title.
  - name: sessions
    kind: windows
    runtime: 6s
    windows:
      - title: "~/work/api"
        lines:
          - "$ claude"
          - "▸ fix the retry handler"
          - "  Read src/retry/handler.go"
      - title: "~/work/web"
        lines:
          - "$ claude"
          - "▸ add dark mode toggle"
          - "  Edit src/pages/Settings.tsx"
      - title: "~/work/infra"
        lines:
          - "$ claude"
          - "▸ debug the helm chart"
          - "  Bash helm template ."

  # Where did the money go? Answered with evidence, in the real agentop.
  - name: insights
    kind: tui
    runtime: 30s
    beats:
      - label: sessions
        keys: []
        hold: 5s
      - label: spend
        keys: ["$"]
        hold: 6s
      - label: usage
        keys: ["$", "u"]
        hold: 4s
      - label: events
        keys: ["esc", "G", "enter"]
        hold: 5s
      # "up" off the bottom lands on the last REQUEST rather than its response:
      # the request is the event carrying the tool manifest and the whole
      # conversation, which is the thing this act exists to show.
      - label: detail
        keys: ["up", "enter"]
        hold: 4s
      # Two pages down lands on the boundary where the conversation ends and
      # "tools": [ begins — the manifest this agent re-sends on every turn.
      - label: manifest
        keys: ["f", "f"]
        hold: 4s
      - label: back
        keys: ["esc", "esc"]
        hold: 2s

    # Synthetic sessions. Costs are per turn and the tier split is derived from
    # the token counts, so the COST column, the spend band and the `$` breakdown
    # all agree with each other.
    fixture:
      sessions:
        - id: api-7f3c
          title: "fix the retry handler"
          model: claude-opus-5
          turns:
            - {messages: 4, tools: 15, input: 1800, cache_read: 46000, cache_write: 9000, output: 620, reasoning: 341, prompt_usd: 0.098, output_usd: 0.047, tool_call: "tools/call", tool_host: "github-tool-mcp"}
            - {messages: 10, tools: 15, input: 900, cache_read: 93000, cache_write: 2400, output: 810, reasoning: 446, prompt_usd: 0.121, output_usd: 0.061}
            - {messages: 16, tools: 15, input: 1100, cache_read: 141000, cache_write: 3100, output: 940, reasoning: 517, prompt_usd: 0.174, output_usd: 0.071}
        - id: web-2a91
          title: "add dark mode toggle"
          model: claude-opus-5
          turns:
            - {messages: 4, tools: 15, input: 1200, cache_read: 21000, cache_write: 6400, output: 380, reasoning: 209, prompt_usd: 0.061, output_usd: 0.029}
            - {messages: 8, tools: 15, input: 700, cache_read: 44000, cache_write: 1800, output: 520, reasoning: 286, prompt_usd: 0.074, output_usd: 0.039}
        - id: infra-55de
          title: "debug the helm chart"
          model: claude-sonnet-5
          turns:
            - {messages: 4, tools: 15, input: 800, cache_read: 12000, cache_write: 3200, output: 240, reasoning: 132, prompt_usd: 0.012, output_usd: 0.004}
