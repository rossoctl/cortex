# Storyboard for the cortex README animation.
#
# Regenerate the asset after editing:  go run .
# CI fails if docs/assets/cortex-demo.svg does not match this file.
#
# The shell acts follow the README's quick start command for command: install, connect
# the agent in a new terminal, run it as usual, and watch it in another.
#
# Every string in the shell acts is copied from the real source, not paraphrased.
# The sources are scripts/install.sh (the title and the progress bar); agentop setup,
# which install.sh execs: cmd/agentop/cmd_setup.go, cmd/agentop/setup_step_*.go and
# cmd/agentop/checklist; and agentop configure claude-code: cmd/agentop/cmd_claudecode.go.
# grep a quoted fragment below to find the line it came from, rather than trusting a
# line number here. Most of these strings interpolate a variable at source, so grep a
# literal prefix of one rather than the whole rendered line. Configure's lines are
# cmd_claudecode_characterize_test.go's, with /Users/you as the home directory.
# If those strings change, change them here too — the demo claims to be cortex.
#
# The install act is what a 120-column terminal shows, escapes included: install.sh's
# title_line and done_line (its title right-aligned to column 78, a 40-cell bar), then
# setup on a terminal, as setup_e2e_test.go's onScreen sees it with
# CORTEX_INSTALLER_DREW=1. The colours are checklist.go's dark values — accent
# 38;2;249;112;102, ok 38;2;110;231;183, faint 38;2;156;163;175 — and install.sh's bar
# accent, 38;5;167. The download is v0.9.0-rc.3's two darwin/arm64 archives, 15.6 MB.
# Two things a shell act cannot draw: the bar's percentage and byte count, which count
# up as it fills, show only once it is full; and the spinner on a running step, which
# the pause before its ✓ stands in for.

total: 58s
grid:
  cols: 120
  rows: 34

acts:
  # The one-liner exactly as the README gives it, with no flags: setup asks once,
  # for everything it will change, so the consent prompt arrives in the middle of the
  # install with nothing typed but the y. Without --claude-code its closing hint
  # names agentop exec, not configure; the next act is the README's next step.
  - name: install
    kind: shell
    runtime: 13s
    steps:
      - cmd: "curl -fsSL https://www.rossoctl.dev/cortex/install.sh | sh"
        out:
          - "  rosso cortex · installer                               v0.9.3 · darwin/arm64"
          - "  \e[38;5;167m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\e[0m  100%  15.6 MB · sha256 ✓  2.0s"
          - ""
          - "  This will:"
          - "    install  agentop, cortex       \e[38;2;156;163;175m~/.local/bin\e[0m"
          - "    add      ~/.local/bin to PATH  \e[38;2;156;163;175m~/.zshrc (2 marked lines)\e[0m"
          - "    write    the cortex config     \e[38;2;156;163;175m~/.cortex/config.yaml\e[0m"
          - "    run      the cortex proxy      \e[38;2;156;163;175mlaunchd user agent · 127.0.0.1:47600\e[0m"
          - ""
          - "  \e[38;2;156;163;175mUndo any time: agentop uninstall\e[0m"
          - ""
          - "  Continue? [Y/n] y"
          - ""
          - "  \e[38;2;110;231;183m✓\e[0m installed    agentop, cortex → ~/.local/bin                           \e[38;2;156;163;175m0.3s\e[0m"
          - "  \e[38;2;110;231;183m✓\e[0m PATH         ~/.zshrc                                                 \e[38;2;156;163;175m0.1s\e[0m"
          - "  \e[38;2;110;231;183m✓\e[0m config       ~/.cortex/config.yaml                                    \e[38;2;156;163;175m0.2s\e[0m"
          - "  \e[38;2;110;231;183m✓\e[0m started      launchd user agent · healthy on 127.0.0.1:47600          \e[38;2;156;163;175m1.3s\e[0m"
          - ""
          - "  \e[38;2;249;112;102m ██████╗ ██████╗ ██████╗ ████████╗███████╗██╗  ██╗\e[0m"
          - "  \e[38;2;249;112;102m██╔════╝██╔═══██╗██╔══██╗╚══██╔══╝██╔════╝╚██╗██╔╝\e[0m"
          - "  \e[38;2;249;112;102m██║     ██║   ██║██████╔╝   ██║   █████╗   ╚███╔╝\e[0m"
          - "  \e[38;2;249;112;102m██║     ██║   ██║██╔══██╗   ██║   ██╔══╝   ██╔██╗\e[0m"
          - "  \e[38;2;249;112;102m╚██████╗╚██████╔╝██║  ██║   ██║   ███████╗██╔╝ ██╗\e[0m"
          - "  \e[38;2;249;112;102m ╚═════╝ ╚═════╝ ╚═╝  ╚═╝   ╚═╝   ╚══════╝╚═╝  ╚═╝\e[0m"
          - ""
          - "    v0.9.3 ready in 1.9s"
          - ""
          - "  Open a new terminal, then:"
          - ""
          - "    agentop exec -- <cmd>        \e[38;2;156;163;175m# send an agent through Cortex\e[0m"
          - ""
          - "  \e[38;2;156;163;175mUndo any time: agentop uninstall\e[0m"
        # The long pause on the download is the trick that makes an authored
        # sequence read as a machine doing work rather than a text dump: the bar fills
        # through it. Setup then prints the whole consent screen at once, and each ✓ as
        # its step ends; the wait for /healthz is the long one. Each ✓ shows the pause
        # before it as its time, and "ready in" is their sum.
        ansi: true
        bar: 1
        slow:
          - 150ms
          - 2000ms
          - 250ms
          - 30ms
          - 40ms
          - 40ms
          - 40ms
          - 40ms
          - 30ms
          - 30ms
          - 30ms
          - 1200ms
          - 30ms
          - 300ms
          - 100ms
          - 200ms
          - 1300ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms

  # A new terminal, because the PATH edit reaches only new ones — and a new screen,
  # which is what lets configure's preview fit. The macOS note is printed on every
  # darwin enable that has something to write, so it stays.
  - name: connect
    kind: shell
    runtime: 7s
    steps:
      - cmd: "agentop configure claude-code enable"
        out:
          - "Note: on macOS, Go tools (go, gh, helm) trust only the keychain, so unless"
          - "  macOS trusts Cortex's CA, Cortex passes their HTTPS through unread rather"
          - "  than breaking them. To have Cortex read them:"
          - "    security add-trusted-cert -k ~/Library/Keychains/login.keychain-db -p ssl \\"
          - "      /Users/you/.cortex/ca/ca.crt"
          - "  (undo: security delete-certificate -c authbridge-tls-bridge-ca \\"
          - "     ~/Library/Keychains/login.keychain-db)"
          - ""
          - "Adds to the \"env\" block of /Users/you/.claude/settings.json:"
          - "  HTTPS_PROXY=http://127.0.0.1:47600"
          - "  NODE_EXTRA_CA_CERTS=/Users/you/.cortex/ca/ca.crt"
          - "  SSL_CERT_FILE=/Users/you/.cortex/ca/bundle.crt"
          - "  GIT_SSL_CAINFO=/Users/you/.cortex/ca/bundle.crt"
          - "  REQUESTS_CA_BUNDLE=/Users/you/.cortex/ca/bundle.crt"
          - "  CURL_CA_BUNDLE=/Users/you/.cortex/ca/bundle.crt"
          - "  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1"
          - "Nothing else in the file changes; a copy is kept as /Users/you/.claude/settings.json.bak"
          - ""
          - "Apply? [y/N] y"
          - "Enabled — run `claude` as usual."
        # Everything up to the prompt prints at once; the pause before the y is the
        # reader's time to take in what will be written.
        slow:
          - 200ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 30ms
          - 1500ms
          - 300ms

  # Three Claude Code sessions, one per working directory, each started the way it
  # always was. These are the same three agentop opens on: it names sessions from
  # Claude Code metadata, so the reader should recognise them by title.
  - name: sessions
    kind: windows
    runtime: 6s
    windows:
      - title: "~/work/api"
        lines:
          - "$ claude"
          - "▸ fix the retry handler"
          - "  Read src/retry/handler.go"
      - title: "~/work/web"
        lines:
          - "$ claude"
          - "▸ add dark mode toggle"
          - "  Edit src/pages/Settings.tsx"
      - title: "~/work/infra"
        lines:
          - "$ claude"
          - "▸ debug the helm chart"
          - "  Bash helm template ."

  # In another terminal, the command that opens the next act. Nothing else on screen
  # names it now that setup's closing hint is agentop exec.
  - name: observe
    kind: shell
    runtime: 2s
    steps:
      - cmd: "agentop observe"

  # Where did the money go? Answered with evidence, in the real agentop.
  - name: insights
    kind: tui
    runtime: 30s
    beats:
      - label: sessions
        keys: []
        hold: 5s
      - label: spend
        keys: ["$"]
        hold: 6s
      - label: usage
        keys: ["$", "u"]
        hold: 4s
      - label: events
        keys: ["esc", "G", "enter"]
        hold: 5s
      # "up" off the bottom lands on the last REQUEST rather than its response:
      # the request is the event carrying the tool manifest and the whole
      # conversation, which is the thing this act exists to show.
      - label: detail
        keys: ["up", "enter"]
        hold: 4s
      # Two pages down lands on the boundary where the conversation ends and
      # "tools": [ begins — the manifest this agent re-sends on every turn.
      - label: manifest
        keys: ["f", "f"]
        hold: 4s
      - label: back
        keys: ["esc", "esc"]
        hold: 2s

    # Synthetic sessions. Costs are per turn and the tier split is derived from
    # the token counts, so the COST column, the spend band and the `$` breakdown
    # all agree with each other.
    fixture:
      sessions:
        - id: api-7f3c
          title: "fix the retry handler"
          model: claude-opus-5
          turns:
            - {messages: 4, tools: 15, input: 1800, cache_read: 46000, cache_write: 9000, output: 620, reasoning: 341, prompt_usd: 0.098, output_usd: 0.047, tool_call: "tools/call", tool_host: "github-tool-mcp"}
            - {messages: 10, tools: 15, input: 900, cache_read: 93000, cache_write: 2400, output: 810, reasoning: 446, prompt_usd: 0.121, output_usd: 0.061}
            - {messages: 16, tools: 15, input: 1100, cache_read: 141000, cache_write: 3100, output: 940, reasoning: 517, prompt_usd: 0.174, output_usd: 0.071}
        - id: web-2a91
          title: "add dark mode toggle"
          model: claude-opus-5
          turns:
            - {messages: 4, tools: 15, input: 1200, cache_read: 21000, cache_write: 6400, output: 380, reasoning: 209, prompt_usd: 0.061, output_usd: 0.029}
            - {messages: 8, tools: 15, input: 700, cache_read: 44000, cache_write: 1800, output: 520, reasoning: 286, prompt_usd: 0.074, output_usd: 0.039}
        - id: infra-55de
          title: "debug the helm chart"
          model: claude-sonnet-5
          turns:
            - {messages: 4, tools: 15, input: 800, cache_read: 12000, cache_write: 3200, output: 240, reasoning: 132, prompt_usd: 0.012, output_usd: 0.004}
