[project]
name = "aiac"
version = "0.1.0"
description = "AIAC — IdP configuration, PDP policy writer, and policy store services for Kagenti."
requires-python = ">=3.12"
# Runtime dependencies — union of the per-service requirements.txt files under src/aiac/.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-keycloak",
    "python-dotenv",
    "requests",
    "kubernetes",
    "nats-py",
    "httpx",
    "langgraph",
    "langchain-openai",
    "chromadb",
    "tenacity",
]

[project.optional-dependencies]
# Test/dev tooling — install with: uv pip install -e ".[test]"
test = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# cryptography is a transitive dep (jwcrypto -> python-keycloak). Floor it at
# 50.0.0 to clear GHSA-g6cj-pr64-35w5 (Bleichenbacher oracle, high) flagged by
# dependency-review against 49.0.0.
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Apply excludes even to paths passed explicitly (e.g. by pre-commit / CI).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["test", "eval"]
pythonpath = ["src"]
# Bare `pytest` runs unit tests only — every live-infra marker is excluded by
# default. `-m` on the command line overrides this (last `-m` wins), so
# `pytest eval/ -m eval_extended` etc. still works to opt back in.
addopts = ["-m", "not integration and not eval_extended and not eval_consistency and not eval_robustness and not eval_correctness_prb and not eval_correctness_e2e"]
markers = [
    "integration: tests that call real LLM endpoints",
    "llm: tests that call the real LLM but mock descriptions/policy (no cluster)",
    "eval_extended: heavier multi-scenario policy-pipeline evaluation tests — same live infra as `integration`, but several full pipeline runs and many more PRB/LLM calls per session (see eval/test_policy_pipeline_eval.py)",
    "eval_consistency: PRB run-to-run consistency (same scenario, N repeats, exact grant-set equality) — needs LLM_BASE_URL/LLM_MODEL/LLM_API_KEY only, no Keycloak/opa (see eval/test_policy_pipeline_consistency.py)",
    "eval_robustness: PRB robustness to mechanical + semantic input perturbation against the truth-table oracle — needs LLM_BASE_URL/LLM_MODEL/LLM_API_KEY only, no Keycloak/opa (see eval/test_policy_pipeline_robustness.py)",
    "eval_correctness_prb: PRB-level correctness — precision/recall + a denial-precision figure against the primary corpus's hand-authored truth tables, zero-tolerance over-grant gate — needs LLM_BASE_URL/LLM_MODEL/LLM_API_KEY only, no Keycloak/opa (see eval/test_policy_pipeline_correctness_prb.py)",
    "eval_correctness_e2e: end-to-end correctness — same precision/recall + denial-precision scorer as eval_correctness_prb, but through the full Keycloak+PCE+OPA pipeline via opa eval — needs KEYCLOAK_URL + admin creds + LLM_BASE_URL/LLM_MODEL/LLM_API_KEY, plus opa on PATH (see eval/test_policy_pipeline_correctness_e2e.py)",
]
