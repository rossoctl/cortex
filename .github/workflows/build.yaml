name: Build-Publish

on:
  # Trigger on tags like v1.0.0
  push:
    tags:
      - 'v*'
    # Trigger on PR merges to main
    branches:
      - main
  # Build (without pushing) on PRs, so a broken Dockerfile fails before merge
  pull_request:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push images to ghcr.io

    strategy:
      matrix:
        image_config:
          # iptables init container — used by envoy-sidecar mode to
          # set up traffic redirection. Proxy-sidecar mode does not
          # need this (HTTP_PROXY env var routing replaces iptables).
          - name: proxy-init
            context: ./deploy/proxy-init
            dockerfile: Dockerfile.init

          # AuthBridge envoy-sidecar combined image —
          # Envoy + cortex-envoy (ext_proc). SVIDs are fetched
          # in-process over the SPIRE Workload API; no spiffe-helper.
          - name: authbridge-envoy
            context: .
            dockerfile: cmd/cortex-envoy/Dockerfile

          # AuthBridge proxy-sidecar combined image (default mode) —
          # cortex (full plugin set, includes parsers).
          # No Envoy, no gRPC. SVIDs are fetched in-process over the
          # SPIRE Workload API; no spiffe-helper.
          - name: authbridge
            context: .
            dockerfile: cmd/cortex/Dockerfile

          # AuthBridge proxy-sidecar LITE image — the SAME cortex
          # binary + Dockerfile, built with a trimmed plugin set (roughly
          # halving the binary). A build variant, not a separate binary.
          # GO_BUILD_TAGS is derived at step time from
          # scripts/profile-tags rather than declared here, so
          # adding a plugin doesn't require editing this file.
          - name: authbridge-lite
            context: .
            dockerfile: cmd/cortex/Dockerfile

          # AuthBridge proxy-sidecar CPEX image — cortex built
          # with -tags cpex (links libcpex_ffi.a from a pinned CPEX
          # release) so the `cpex` plugin routes hooks through the CPEX
          # framework (APL DSL + named CPEX policy plugins). The FFI pin
          # files in cmd/cortex-cpex/ (CPEX_FFI_VERSION, CPEX_FFI_ABI,
          # CPEX_FFI_SHA256) are its only source: the Dockerfile reads them
          # and takes no FFI build-arg.
          - name: authbridge-cpex
            context: .
            dockerfile: cmd/cortex-cpex/Dockerfile

          # SPARC reflection service — the backend the `sparc` plugin calls.
          # Deployed once per cluster via deploy/sparc-service/deploy.
          - name: sparc-service
            context: ./deploy/sparc-service
            dockerfile: Dockerfile

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 1b. Set up Go — the buildargs step resolves each image's GO_BUILD_TAGS
      # from its profile at build time. Cheap to install for every matrix row
      # (~1s of cache pull); no-op for rows that don't need it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scripts/profile-tags/go.mod

      # 2. Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # 4. Log in to GitHub Container Registry (not on PRs: they don't push)
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Generate image tag
      - name: Generate image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # Use branch name or 'manual' for workflow_dispatch
            BRANCH="${{ github.ref_name }}"
            # Sanitize branch name (replace / with -)
            BRANCH="${BRANCH//\//-}"
            echo "tag=${BRANCH}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      # 6. Extract Docker metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image_config.name }}
          tags: |
            # Always use the computed tag
            type=raw,value=${{ steps.tag.outputs.tag }}
            # Add 'latest' tag for version tags, workflow_dispatch, and pushes to main
            type=raw,value=latest,enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}

      # 6b. Resolve per-image build-args.
      #   authbridge-cpex takes no CPEX FFI build-arg: its Dockerfile reads
      #     the pin files in cmd/cortex-cpex/, the only source of the version.
      #   Every Go image passes GO_BUILD_TAGS naming a profile from
      #     scripts/profile-tags. Plugins are all opt-in, so an
      #     image built without tags registers NO plugins and rejects every
      #     config it is handed — there is no safe empty default here.
      #   Images with no Go plugin surface (proxy-init, sparc-service) still
      #     leave args empty; an undeclared build-arg is ignored.
      - name: Resolve build args
        id: buildargs
        run: |
          profile_tags() { go -C scripts/profile-tags run . "$1"; }
          case "${{ matrix.image_config.name }}" in
            authbridge-cpex)
              {
                echo "args<<EOF"
                echo "GO_BUILD_TAGS=$(profile_tags cpex)"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            authbridge)
              {
                echo "args<<EOF"
                echo "GO_BUILD_TAGS=$(profile_tags full)"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            authbridge-lite)
              {
                echo "args<<EOF"
                echo "GO_BUILD_TAGS=$(profile_tags lite)"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            authbridge-envoy)
              {
                echo "args<<EOF"
                echo "GO_BUILD_TAGS=$(profile_tags envoy)"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "args=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # 7. Build and push image
      - name: Build and push ${{ matrix.image_config.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.image_config.context }}
          file: ${{ matrix.image_config.context }}/${{ matrix.image_config.dockerfile }}
          # Dynamically-resolved args from step 6b: GO_BUILD_TAGS from
          # scripts/profile-tags for every Go image. Images with no Go
          # plugin surface resolve to empty.
          build-args: |
            ${{ steps.buildargs.outputs.args }}
          push: ${{ github.event_name != 'pull_request' }}
          # PRs build amd64 only: arm64 runs under QEMU and only adds time.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
