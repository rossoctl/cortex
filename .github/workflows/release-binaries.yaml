name: Release binaries

# Cross-compiles the standalone `agentop` and `cortex` binaries and
# attaches them (with SHA-256 checksums) to the GitHub Release for a `v*` tag.
# Both are pure-Go (CGO_ENABLED=0); each cmd module resolves core via its
# `replace => ../../core`, so builds run per-module with GOWORK=off — no
# workspace needed. workflow_dispatch runs a dry build that only uploads
# workflow artifacts (no Release), for testing.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version string to stamp for a dry-run build (no Release is created)'
        required: false
        default: 'dev'

permissions:
  contents: read

# Scoped by ref, because main-latest is the first FIXED, reused release target this
# repo has had: every v* tag is unique, so two runs never contended for the same
# assets before. Two merges inside one build window would otherwise have both runs
# uploading every asset with --clobber, interleaving into a mixed asset set plus a
# checksums.txt from whichever finished last — which users meet as "checksum
# verification failed", an alarming message for what is really a publish race.
# Superseding is right for a rolling channel: only the newest tip matters.
# event_name is in the group, not just the ref: github.ref is refs/heads/main for BOTH a
# push to main and a workflow_dispatch (which defaults to the default branch), so a ref-
# only group let someone clicking "Run workflow" cancel a merge build mid-upload.
concurrency:
  group: release-binaries-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    # The developer channel is off until a release containing the newest_release()
    # v-tag filter exists. Set MAIN_CHANNEL_ENABLED=true in repo variables after
    # cutting that release.
    #
    # Precisely what that protects, because an earlier version of this comment
    # overstated it: the DEFAULT one-liner is safe as soon as main carries the filter,
    # since it resolves a v-tag and re-execs the released copy, and that copy's
    # resolve_version then returns the v* tag it was handed without calling
    # newest_release at all. What needs a filtered release is anyone invoking a
    # RELEASED copy as the parent, fetched from a tag's URL — as the one-liner in
    # v0.7.0's own "has no 'service' command" message does. (The one install.sh prints
    # now, for an agentop with no setup command, fetches main's copy with --ref.) An
    # unfiltered parent resolves the rolling release as its version and installs
    # unreleased binaries.
    #
    # workflow_dispatch stays ungated: it publishes nothing, it only uploads artifacts.
    if: >-
      github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
      || vars.MAIN_CHANNEL_ENABLED == 'true'
    permissions:
      # create/update the Release, upload assets, and move the rolling tag.
      #
      # This is reachable on every `main` push now, not only on tag pushes, so the blast
      # radius of a compromised step in this job is larger than it was. Nothing here is
      # known-wrong — the job builds only first-party code and every action is SHA-pinned
      # — but the scope change deserves a look at the moment it starts mattering, which
      # is when MAIN_CHANNEL_ENABLED flips rather than when this merges. It is listed as
      # a pre-enable check in CONTRIBUTING for that reason.
      #
      # If that look wants a smaller surface, the shape is splitting build (contents:
      # read) from publish (contents: write) and passing dist/ between them as an
      # artifact. Not done here: it is a restructuring, not a fix, and the gate keeps
      # this inert until someone decides.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every commit and tag, so release_notes.sh can find the previous release
          # by ancestry. blob:none keeps that to commits and trees; the build fetches
          # the blobs of this one commit only.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: cmd/cortex/go.mod

      - name: Build binaries (linux/darwin, amd64/arm64)
        env:
          # Untrusted input passed via env (never interpolated into the script).
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # TAG names the rolling release and the assets, so the download URL is
            # predictable. VERSION identifies the build, and the two must differ:
            # agentop's serviceIsCurrent compares the stamp recorded in the installed
            # launchd unit against the running binary to decide whether `service
            # install` is a no-op. A constant stamp would report "Already current"
            # while the old binary kept running — hiding upgrades on the one channel
            # that changes every merge.
            #
            # "main-latest", not "main": a GitHub release needs a git tag, and a tag
            # named `main` collides with the branch. Verified — `git rev-parse main`
            # then resolves to the tag, every git command warns that the refname is
            # ambiguous, and the tag freezes at the first publish while the branch
            # moves on. Must match CHANNEL_TAG in install.sh.
            TAG="main-latest"
            VERSION="main-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          else
            TAG="${INPUT_TAG:-dev}"
            VERSION="${INPUT_TAG:-dev}"
          fi
          echo "Building ${VERSION} for release ${TAG}"
          # Hand both to later steps rather than re-deriving them there. The publish
          # step used GITHUB_REF_NAME, which is "main" on a main push — it would have
          # published to the wrong tag the moment the two stopped being equal.
          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
          } >> "${GITHUB_ENV}"
          mkdir -p dist

          # cortex variants: "<suffix>:<build-tags>". Empty suffix is
          # the default artifact. Every plugin is opt-in, so a variant with no
          # tags would register NO plugins and reject every config it is given —
          # each entry must name a profile. Profiles live in
          # scripts/profile-tags; never enumerate tag combos here.
          profile_tags() { go -C scripts/profile-tags run . "$1"; }
          full_tags=$(profile_tags full)
          declare -a proxy_variants=(
            ":${full_tags}"
          )

          build_proxy() {
            local variant="$1" tags="$2" os="$3" arch="$4"
            local suffix=""; [ -n "${variant}" ] && suffix="-${variant}"
            # ${TAG}, not ${VERSION}: the filename has to match the download URL the
            # installer builds from the release tag. They are the same string for a
            # v* tag and differ only on the rolling channel release.
            local archive="dist/cortex${suffix}_${TAG}_${os}_${arch}.tar.gz"
            echo "==> cortex${suffix} ${os}/${arch}"
            ( cd cmd/cortex && \
              GOWORK=off CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath \
                -tags "${tags}" \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "${GITHUB_WORKSPACE}/dist/cortex" . )
            tar -C dist -czf "${archive}" cortex
            rm -f dist/cortex
          }

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"

            echo "==> agentop ${os}/${arch}"
            ( cd cmd/agentop && \
              GOWORK=off CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "${GITHUB_WORKSPACE}/dist/agentop" . )
            tar -C dist -czf "dist/agentop_${TAG}_${os}_${arch}.tar.gz" agentop
            rm -f dist/agentop

            for entry in "${proxy_variants[@]}"; do
              build_proxy "${entry%%:*}" "${entry#*:}" "${os}" "${arch}"
            done
          done
          ( cd dist && sha256sum ./*.tar.gz > checksums.txt )
          ls -l dist

      - name: Publish to GitHub Release
        # A main push publishes too, which is the whole point of the channel; the
        # job-level gate already requires MAIN_CHANNEL_ENABLED for that path.
        #
        # `event_name == 'push'` ALONE, deliberately. A tag push already satisfies it,
        # so adding `ref_type == 'tag'` bought nothing except one bad case: dispatching
        # this workflow against a tag ref gives ref_type=='tag' with
        # event_name=='workflow_dispatch', which published and --clobbered that
        # release's assets. The dry run is supposed to publish nothing.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # TAG comes from the build step via GITHUB_ENV — one derivation, not two.
          [ -n "${TAG:-}" ] || { echo "TAG not set by the build step" >&2; exit 1; }
          # This decides who gets the release. A prerelease never takes GitHub's
          # "Latest" badge, and Latest is what the plain one-liner installs, so a
          # flagged release reaches only someone who names it with --ref. `main` belongs
          # here or the rolling release takes the badge, displacing the newest real
          # release.
          prerelease=""
          case "${TAG}" in
            main-latest | *-rc* | *-alpha* | *-beta*) prerelease="--prerelease" ;;
          esac
          # Build release notes one line at a time so no single string
          # exceeds yamllint's 150-char cap. Single-quoted arguments keep
          # backticks literal (no shell expansion).
          notes=""
          add() { notes="${notes}${1}"$'\n'; }
          # The PRs merged since the previous release lead the page: they are what
          # someone deciding whether to upgrade came for. A failure here costs the
          # list, not the release. main-latest is skipped; its notes are replaced below.
          if [ "${TAG}" != "main-latest" ]; then
            if changes=$(sh scripts/release_notes.sh "${TAG}"); then
              if [ -n "${changes}" ]; then
                add "${changes}"
                add ''
                add '## Install'
                add ''
              fi
            else
              echo "::warning::Could not list the changes since the previous release; publishing ${TAG} without them."
            fi
          fi
          add 'Prebuilt `agentop` and `cortex` binaries for linux and macOS (amd64/arm64).'
          add ''
          # The rename shipped with no alias, so it has to be said somewhere a v0.7.0
          # user will look. Drop this once no supported release predates it.
          add '`agentop` was called `abctl` through v0.7.0. `agentop setup`, which the installer hands'
          add 'off to, deletes the old `~/.local/bin/abctl`; delete one you installed by hand yourself.'
          add '`cortex` was called `authbridge-proxy` (and `cortex-envoy`, `-cpex`, `-praxis` were'
          add '`authbridge-*`); image and container names are unchanged. Setup removes the old'
          add 'binary once the service no longer runs it. Stop a proxy you started by hand first.'
          add ''
          add 'Verify downloads with `sha256sum -c checksums.txt`. On macOS, clear the'
          add 'Gatekeeper quarantine after extracting: `xattr -dr com.apple.quarantine ./agentop`.'
          # Whoever is asked to try a release candidate lands on this page, and the
          # one-liner they already know will not install it.
          if [ -n "${prerelease}" ]; then
            add ''
            add 'This is a prerelease: the plain one-liner does not install it. To try it:'
            add "    curl -fsSL https://www.rossoctl.dev/cortex/install.sh | sh -s -- --ref=${TAG}"
          fi
          # The rolling release is not a release, and its notes should not read like
          # one — someone landing on it from a search result needs to know that
          # before they install it.
          if [ "${TAG}" = "main-latest" ]; then
            notes=""
            add 'Unreleased build from the tip of `main`, rebuilt on every merge. Not a release.'
            add ''
            add 'Install with:'
            add '    curl -fsSL https://www.rossoctl.dev/cortex/install.sh | sh -s -- --ref=main'
            add ''
            add 'Each binary reports its own build (`agentop --version` -> `main-<sha>`). For a'
            add 'supported install, use the plain one-liner, which installs the newest stable release.'
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Uploading assets does not move the tag, so on a REUSED tag the release
            # would keep pointing at its first-publish commit forever: the "Source
            # code" archives and the commit shown on the release page would drift
            # further from the binaries beside them on every merge. Renaming the tag to
            # main-latest fixed ref ambiguity with the branch; it did nothing about
            # freezing. Only for the rolling tag — a v* release must never be moved.
            if [ "${TAG}" = "main-latest" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            fi
            gh release upload "${TAG}" dist/*.tar.gz dist/checksums.txt --clobber
            # --clobber replaces same-named assets but never deletes others, so every
            # name this build stops producing lingers on the rolling release: frozen at
            # its last build, and missing from checksums.txt, so nothing can verify it.
            # Leaving that to a human did not work: abctl_*, authbridge-proxy*_* and
            # cortex-{lite,sessionbudget}_* all outlived the builds that made them. So
            # delete whatever dist/ does not hold. After the upload, so a failed upload
            # deletes nothing; a failed list or delete only leaves what was already
            # there, so either one warns rather than fails the publish. Only for the
            # rolling tag: a v* release is published once, and may carry assets
            # attached by hand.
            if [ "${TAG}" = "main-latest" ]; then
              if names=$(gh release view "${TAG}" --json assets --jq '.assets[].name'); then
                printf '%s\n' "${names}" | while IFS= read -r name; do
                  [ -e "dist/${name}" ] && continue
                  echo "Deleting stale asset ${name}"
                  gh release delete-asset "${TAG}" "${name}" --yes \
                    || echo "::warning::Could not delete stale asset ${name} from ${TAG}."
                done
              else
                echo "::warning::Could not list the assets of ${TAG}; stale ones were not pruned."
              fi
            fi
            # A v* release that already exists was created either by an earlier run of
            # this job, flagged already, or by hand before this ran — from the Releases
            # page, say, where nothing flags it by its tag. Unflagged, a release
            # candidate takes the Latest badge and the plain one-liner installs it.
            # Flagging it here lets the tag decide, whichever path created the
            # release; for main-latest it changes nothing.
            if [ -n "${prerelease}" ]; then
              gh release edit "${TAG}" --prerelease >/dev/null
            fi
          else
            # --target "${GITHUB_SHA}": without it the API defaults target_commitish to
            # the repository's default branch at call time, not the commit that was
            # built. Usually the same on a main push, but it is exactly the drift the
            # PATCH above exists to prevent — and it made the FIRST publish create the
            # tag at the wrong commit, so the two paths disagreed.
            gh release create "${TAG}" dist/*.tar.gz dist/checksums.txt \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" --notes "${notes}" ${prerelease}
          fi

      - name: Upload dry-run artifacts
        # workflow_dispatch only. `!= 'tag'` also matched a main push, which now
        # publishes a real release — it would have uploaded a redundant artifact
        # copy of every asset on every merge.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
