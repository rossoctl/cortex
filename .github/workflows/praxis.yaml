# Praxis - fmt, clippy and tests for the Rust workspace in praxis/
#
# Runs when praxis/ changes, or when the Go code that praxis/ ports changes.
# A failure blocks the PR only for a change to praxis/, to this file, or to the Go side
# of praxis mode (the hop, the egress listener, cmd/cortex's praxis wiring). Any other
# Go change runs the steps too, so drift shows, but does not block.
#
name: Praxis

on:
  pull_request:
    branches:
      - main
      - "release-*"
    paths:
      - "praxis/**"
      - ".github/workflows/praxis.yaml"
      - "core/attribution/wire.go"
      - "core/attribution/testdata/**"
      - "core/parse/**"
      - "core/internal/parsercommon/**"
      - "core/model/extensions.go"
      - "core/pipeline/testdata/**"
      - "core/plugins/inferenceparser/**"
      - "core/plugins/mcpparser/**"
      - "core/plugins/a2aparser/**"
      - "core/listener/internal/sseframe/**"
      - "core/internal/parsefixture/**"
      - "core/model/client.go"
      - "core/cost/settle/settle.go"
      - "core/listener/forwardproxy/server.go"
      - "core/sessionapi/ingest*.go"
      - "core/sessionapi/testdata/ingest/**"
      - "core/redact/**"
      - "core/pipeline/subagent.go"
      - "core/listener/forwardproxy/ingest_replay_test.go"
      - "core/listener/forwardproxy/hop*.go"
      - "core/listener/forwardproxy/egress*.go"
      - "cmd/cortex/praxis*.go"
      - "cmd/cortex/gateway.go"
      - "cmd/cortex/ingest.go"
  push:
    branches:
      - main
    paths:
      - "praxis/**"
      - ".github/workflows/praxis.yaml"
      - "core/attribution/wire.go"
      - "core/attribution/testdata/**"
      - "core/parse/**"
      - "core/internal/parsercommon/**"
      - "core/model/extensions.go"
      - "core/pipeline/testdata/**"
      - "core/plugins/inferenceparser/**"
      - "core/plugins/mcpparser/**"
      - "core/plugins/a2aparser/**"
      - "core/listener/internal/sseframe/**"
      - "core/internal/parsefixture/**"
      - "core/model/client.go"
      - "core/cost/settle/settle.go"
      - "core/listener/forwardproxy/server.go"
      - "core/sessionapi/ingest*.go"
      - "core/sessionapi/testdata/ingest/**"
      - "core/redact/**"
      - "core/pipeline/subagent.go"
      - "core/listener/forwardproxy/ingest_replay_test.go"
      - "core/listener/forwardproxy/hop*.go"
      - "core/listener/forwardproxy/egress*.go"
      - "cmd/cortex/praxis*.go"
      - "cmd/cortex/gateway.go"
      - "cmd/cortex/ingest.go"

permissions:
  contents: read

jobs:
  rust:
    name: Rust (praxis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for praxis changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The hop, the egress listener and the gateway wiring are praxis mode's Go side,
          # not ported code: a change there that breaks the end-to-end tests must block.
          pattern='^(praxis/|\.github/workflows/praxis\.yaml$|core/listener/forwardproxy/(hop|egress)[^/]*\.go$|cmd/cortex/(praxis[^/]*|gateway|ingest)\.go$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$pattern"; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            echo "No praxis-mode changes. Failures do not block."
          fi

      # Installs the toolchain that praxis/rust-toolchain.toml names.
      - name: Install the Rust toolchain
        working-directory: praxis
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: praxis
          cache-on-failure: false

      - name: cargo fmt
        id: fmt
        working-directory: praxis
        continue-on-error: ${{ steps.changes.outputs.blocking != 'true' }}
        run: cargo fmt --check

      - name: cargo clippy
        id: clippy
        working-directory: praxis
        continue-on-error: ${{ steps.changes.outputs.blocking != 'true' }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        id: test
        working-directory: praxis
        continue-on-error: ${{ steps.changes.outputs.blocking != 'true' }}
        run: cargo test --locked

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: cmd/cortex/go.mod

      # Runs from the repo root: the command names praxis/ and cmd/cortex. rustup reads
      # rust-toolchain.toml only below praxis/, so the step names that toolchain itself.
      - name: End-to-end (praxis mode)
        id: e2e
        continue-on-error: ${{ steps.changes.outputs.blocking != 'true' }}
        run: |
          set -euo pipefail
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' praxis/rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN
          cargo build --locked -p cortex-gateway --manifest-path praxis/Cargo.toml
          TAGS=$(GOWORK=off go -C scripts/profile-tags run . local)
          CORTEX_GATEWAY_BIN=$PWD/praxis/target/debug/cortex-gateway GOWORK=off go -C cmd/cortex test -count=1 -timeout 15m -tags "praxis_e2e,$TAGS" -run TestPraxisE2E .

      # A report-only run passes, so a warning on the PR shows the parity gap.
      - name: Report failures that do not block
        if: always() && steps.changes.outputs.blocking != 'true'
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          [ "$FMT" != failure ] || echo "::warning::cargo fmt failed (does not block: no praxis-mode changes)"
          [ "$CLIPPY" != failure ] || echo "::warning::cargo clippy failed (does not block: no praxis-mode changes)"
          [ "$TEST" != failure ] || echo "::warning::cargo test failed (does not block: no praxis-mode changes)"
          [ "$E2E" != failure ] || echo "::warning::praxis end-to-end tests failed (does not block: no praxis-mode changes)"

      # Size cap: the cache post-step must not save a target/ over 3 GiB.
      - name: Cap the target/ cache size
        if: always()
        run: |
          set -euo pipefail
          [ -d praxis/target ] || exit 0
          size=$(du -sm praxis/target | cut -f1)
          echo "praxis/target: ${size} MB"
          if [ "$size" -gt 3072 ]; then
            echo "Over 3072 MB; removing praxis/target so the cache does not save it."
            rm -rf praxis/target
          fi
