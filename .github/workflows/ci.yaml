# CI - Lint, test, and build for all modules
#
# Runs on PRs and pushes to main/release branches.
# Covers the Go modules, Python tests, and repo scripts.
#
name: CI

on:
  pull_request:
    branches:
      - main
      - "release-*"
  push:
    branches:
      - main

# Cancel a PR run that a newer push to the same PR replaced: its head is stale, and it would
# otherwise hold one of the org's shared runner slots until it finished. Push, tag and dispatch runs
# group on ref plus commit, so each has a group of its own and nothing on main or a tag is dropped or
# cancelled (with a shared group GitHub drops a queued run when a newer one queues). Same convention as
# rossoctl/context-guru#1363.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        env:
          SKIP: ai-assisted-by-trailer

  go-ci-core:
    name: Go CI (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Build
        run: go build -v ./...

      # Prints the module's total statement coverage as the last line, for a future
      # coverage gate. `make coverage` reports the same figures locally.
      - name: Test
        run: |
          go test -v -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  # core/peerproc reads the macOS kernel's TCP table by byte offset and checks its record
  # sizes against the layout it was written for, so only a macOS runner exercises that
  # code. The Linux job above covers the /proc implementation.
  go-ci-core-macos:
    name: Go CI (core peerproc, macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Vet
        run: go vet ./peerproc/...

      - name: Test
        run: go test -v -race ./peerproc/...

      # The TLS bridge's trust check reaches Security.framework on darwin, which no
      # Linux job exercises. Only its tests, not the package's: the rest of tlsbridge
      # is platform-neutral and the Linux job already runs it.
      - name: Vet (tlsbridge)
        run: go vet ./tlsbridge/...

      - name: Test (tlsbridge trust check)
        run: go test -v -race -run 'TestOSTrustCheck|TestClientTrust|TestGoExecutables' ./tlsbridge/...

      # cortex (local profile) and agentop are the laptop binaries, and macOS is
      # where most laptops run them.
      - name: Build and test cmd/cortex (local profile)
        working-directory: cmd/cortex
        env:
          GOWORK: "off"
        run: |
          TAGS=$(go -C ../../scripts/profile-tags run . local)
          go build -tags "${TAGS}" ./...
          go vet -tags "praxis_e2e,${TAGS}" .
          go test -race -tags "${TAGS}" ./...

      # AGENTOP_LAUNCHD_TESTS=required turns a skip in the real-launchd tests into a
      # failure, as AGENTOP_SYSTEMD_TESTS=required does on Linux. They need a desktop
      # session to load a launch agent into, and GitHub's macOS runners have one: they
      # log the runner user in automatically at boot.
      # Not tui/...: it has no macOS-specific code, the Linux agentop job runs it with
      # -race, and here it took about 5 of this job's 10 minutes.
      - name: Build and test cmd/agentop
        working-directory: cmd/agentop
        env:
          GOWORK: "off"
          AGENTOP_LAUNCHD_TESTS: required
        run: |
          go build ./...
          go test -race $(go list ./... | grep -v '/cmd/agentop/tui')

  # Windows (#1520): core and the laptop proxy must keep building, and the session archive and
  # cost ledger must keep writing where a directory is flushed only through a write handle and
  # cannot be renamed with a file open in it. Only those packages' tests run: the rest of core
  # and cmd/cortex still have Unix-only tests (Setpgid, SIGUSR1). agentop builds, but most of
  # its tests need a Unix shell or service manager, so only a named set runs (see its step).
  # No -race: the race detector needs cgo and a C toolchain on the runner.
  go-ci-windows:
    name: Go CI (Windows build, archive and ledger)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOWORK: "off"
    steps:
      # .claude/skills has directories with a colon in their names, which Windows cannot
      # create, so a plain checkout fails. Leave .claude/ out of the worktree. Git still
      # refuses those paths in the index (core.protectNTFS), even as skip-worktree entries,
      # so turn that check off for this step only. actions/checkout passes the step's env to
      # git, and GIT_CONFIG_* applies to every git call it makes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          sparse-checkout: |
            /*
            !/.claude/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build core
        working-directory: core
        run: go build ./...

      - name: Vet and test bootstrap, the session archive and the cost ledger
        working-directory: core
        run: |
          go vet ./bootstrap/... ./session/archive/... ./cost/ledger/...
          go test ./bootstrap/... ./session/archive/... ./cost/ledger/...

      - name: Build cmd/cortex (local profile)
        working-directory: cmd/cortex
        run: |
          TAGS=$(go -C ../../scripts/profile-tags run . local)
          go build -tags "${TAGS}" ./...

      # agentop builds on Windows (#1520). Most of its tests drive a Unix shell, a service
      # manager or signals, so only the tests of the Windows-specific code and of commands
      # that work there run here for now. `go test -run` passes when a name matches nothing,
      # so each listed name must also have run: a renamed test fails the step instead of
      # silently dropping out. Every entry is a full test name, matched exactly, not a prefix
      # that stands for several tests.
      - name: Build, vet and test cmd/agentop
        working-directory: cmd/agentop
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          tests="TestRefuseUnsupported TestProcessAlive TestLockFile TestWritable TestTerminateRefusesOnWindows
            TestNoRecordWanted TestWithRecordOff
            TestAddRecordOff_RefusesASettingsOverride TestAddRecordOff_AppendsToTheEnvironment
            TestAddRecordOff_RefusesAnUnreadableSettingsFile TestAddRecordOff_ChecksClaudeConfigDir
            TestAddRecordOff_RefusesAChildThatIsNotClaudeCode
            TestHomeIsIsolated"
          go test -v -run "^($(echo ${tests} | tr ' ' '|'))\$" . | tee "${RUNNER_TEMP}/agentop-tests.txt"
          for t in ${tests}; do
            grep -qE "^--- (PASS|SKIP): ${t} \(" "${RUNNER_TEMP}/agentop-tests.txt" \
              || { echo "::error::${t} did not run"; exit 1; }
          done
          # The tests' home isolation itself (USERPROFILE as well as HOME), where it matters most.
          go test -v ./internal/testhome/

      # release-binaries.yaml builds every platform in one loop, so a Windows build break would
      # stop the Linux and macOS releases too, and main-latest on every merge. Build exactly its
      # Windows targets here: cortex with the release's proxy variant (the full profile) and
      # agentop, for amd64 and arm64, with cgo off as the release does. Keep the tags in step
      # with proxy_variants there.
      - name: Build the release's Windows targets
        run: |
          set -euo pipefail
          full_tags=$(go -C scripts/profile-tags run . full)
          for arch in amd64 arm64; do
            echo "==> windows/${arch}"
            ( cd cmd/cortex && CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" \
              go build -trimpath -tags "${full_tags}" -o /dev/null . )
            ( cd cmd/agentop && CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" \
              go build -trimpath -o /dev/null . )
          done

  # The cpex plugin's FFI-backed code sits behind the `cpex` build tag and needs
  # cgo plus the pinned libcpex_ffi.a, so no other job compiles or tests it. It
  # runs in Alpine to link the same musl asset the authbridge-cpex image does,
  # and only when a PR touches the code or pins it depends on.
  go-ci-cpex:
    name: Go CI (cpex plugin, cgo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: golang:1.26-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
    defaults:
      run:
        shell: bash
    env:
      GOWORK: "off"
      GOTOOLCHAIN: auto
      CGO_ENABLED: "1"
    steps:
      # bash and git first: checkout needs git for the history the change
      # check reads, and every run step uses bash.
      - name: Install build tools
        shell: sh
        run: apk add --no-cache bash git gcc musl-dev curl cosign

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for cpex changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(core/|cmd/cortex/|cmd/cortex-cpex/|scripts/profile-tags/|scripts/fetch-cpex-ffi\.sh$|\.github/workflows/ci\.yaml$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No cpex-related changes; skipping."
          fi

      - name: Fetch the pinned CPEX FFI
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          dir=$(CPEX_FFI_TARGET=linux-amd64-musl CPEX_FFI_DEST="$RUNNER_TEMP/cpex-ffi" bash scripts/fetch-cpex-ffi.sh)
          echo "CGO_LDFLAGS=-L${dir} -lcpex_ffi -lm" >> "$GITHUB_ENV"

      - name: Vet and test core/plugins/cpex
        if: steps.changes.outputs.run == 'true'
        working-directory: core
        run: |
          go vet -tags cpex ./plugins/cpex/...
          go test -v -count=1 -tags cpex ./plugins/cpex/...

      # cmd/cortex is the binary for both cpex artifacts: the authbridge-cpex
      # image (the `cpex` profile) and full plus cpex (`fullcpex`).
      - name: Vet, build and test cmd/cortex with cpex
        if: steps.changes.outputs.run == 'true'
        working-directory: cmd/cortex
        run: |
          set -euo pipefail
          for profile in cpex fullcpex; do
            echo "::group::profile ${profile}"
            TAGS="cpex,$(go -C ../../scripts/profile-tags run . "${profile}")"
            go vet -tags "$TAGS" ./...
            go build -tags "$TAGS" -o /dev/null .
            echo "::endgroup::"
          done
          go test -count=1 -tags "cpex,$(go -C ../../scripts/profile-tags run . fullcpex)" ./...

  # The plugin-profile guards live in their own module, so no other job runs
  # them. They have to run on every PR: plugins are all opt-in, and a plugin
  # missing from every profile produces no build error — it just silently
  # disappears from every image. TestEveryPluginIsAccountedFor is the only thing
  # between that and a shipped artifact.
  go-ci-profile-tags:
    name: Go CI (plugin profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/profile-tags
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: scripts/profile-tags/go.mod

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      # The guards read sibling trees through relative paths (../../cmd, the repo
      # root), so they need the full checkout, not just this module. -count=1 is
      # required, not cosmetic: Go's test cache keys on this package's own inputs
      # and knows nothing about those sibling files, so a cached PASS can outlive
      # the change that should have broken it.
      - name: Test
        run: go test -count=1 -v -cover ./...

      # Every profile must resolve to a non-empty tag list. A profile that
      # silently yields nothing would flow into `go build -tags ""`.
      - name: Every profile resolves
        run: |
          for profile in local full lite envoy cpex fullcpex hostegress; do
            tags=$(go run . "${profile}")
            [ -n "${tags}" ] || { echo "profile ${profile} resolved to no tags"; exit 1; }
            echo "${profile}: ${tags}"
          done

  # core/storage/redis is its own module, so `go test ./...` in core/ skips it.
  go-ci-redis:
    name: Go CI (core/storage/redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core/storage/redis
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/storage/redis/go.mod
          cache-dependency-path: core/storage/redis/go.sum

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Test
        run: |
          go test -v -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  go-ci-readme-demo:
    name: Go CI (README demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/readme-demo
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: scripts/readme-demo/go.mod

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      # The generator drives the real agentop TUI and compares its output against the
      # committed docs/assets/cortex-demo.svg, so it reads sibling trees through
      # relative paths and needs the full checkout. -count=1 is required, not
      # cosmetic: Go's test cache keys on this package's own inputs and knows
      # nothing about agentop's sources or the committed asset, so a cached PASS can
      # outlive exactly the UI change this job exists to catch.
      - name: Test (includes the asset staleness check)
        run: go test -count=1 -v ./...

  go-ci-authbridge-cmd:
    name: Go CI (authbridge ${{ matrix.binary }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        binary:
          - cortex
          - cortex-envoy
          # agentop is published by release-binaries.yaml, so it has to build
          # under GOWORK=off here too. Omitting it let a missing go.sum entry
          # for a core transitive dep reach main: the workspace build used
          # everywhere else resolved it, and the per-module release build did
          # not — surfacing only when a tag was cut.
          - agentop
          # Any cmd/* module absent from every workflow drifts this way: the
          # workspace hides exactly this class of breakage. (cmd/cortex's cpex
          # builds need CGO and libcpex_ffi.a from a pinned release, so
          # go-ci-cpex covers them instead.)
    defaults:
      run:
        working-directory: cmd/${{ matrix.binary }}
    env:
      # Disable go.work so each cmd/* module resolves core via its own
      # `replace` directive in go.mod (the workspace would otherwise pull
      # all sibling modules in and slow down CI).
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: cmd/${{ matrix.binary }}/go.mod
          cache-dependency-path: cmd/${{ matrix.binary }}/go.sum

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Build
        run: go build -v ./...

      # Every plugin is opt-in, so the Build and Test steps above exercise a
      # binary with NO plugins linked. That is worth compiling on its own — it is
      # what a caller who forgets -tags gets — but the shipped artifacts are the
      # profiles, so build AND test each one here. build.yaml only exercises them
      # on tag/main pushes; this catches a profile-only regression on the PR.
      # hostegress is built only here, and is the one profile that may link the
      # moca driver: the driver's cmd/cortex tests run only in this loop, and its
      # darwin and windows files compile only in its cross-builds.
      - name: Build + test each shipped profile
        if: matrix.binary == 'cortex' || matrix.binary == 'cortex-envoy'
        run: |
          case "${{ matrix.binary }}" in
            cortex) profiles="local full lite hostegress" ;;
            cortex-envoy) profiles="envoy" ;;
          esac
          for profile in ${profiles}; do
            echo "::group::profile ${profile}"
            TAGS=$(go -C ../../scripts/profile-tags run . "${profile}")
            go vet -tags "${TAGS}" ./...
            go build -v -tags "${TAGS}" ./...
            if [ "${profile}" = hostegress ]; then
              GOOS=darwin go build -o /dev/null -tags "${TAGS}" .
              GOOS=windows go build -o /dev/null -tags "${TAGS}" .
            else
              # A here-string, not a pipe, so the check holds under pipefail too.
              deps=$(go list -deps -tags "${TAGS}" .)
              if grep -q core/listener/vmcontrol <<<"${deps}"; then
                echo "profile ${profile} links core/listener/vmcontrol"; exit 1
              fi
            fi
            go test -race -coverprofile=cover.out -tags "${TAGS}" ./...
            echo "coverage (profile ${profile}): $(go tool cover -func=cover.out | tail -1)"
            echo "::endgroup::"
          done

      # Gives the agentop leg a real systemd --user session for
      # cmd_service_systemd_integration_test.go. The runner has no interactive login, so
      # nothing has started one yet; enable-linger asks logind to start and keep one
      # running. Either way a real problem here is loud, not silent: a hard failure (e.g.
      # enable-linger itself failing) fails this step outright under bash -e, so Test
      # never runs; a soft one (session unreachable after enable-linger) only warns here,
      # and AGENTOP_SYSTEMD_TESTS=required (below) is what turns THAT case into a failed
      # test instead of a silent skip.
      - name: Enable a systemd --user session (agentop leg only)
        if: matrix.binary == 'agentop'
        run: |
          sudo loginctl enable-linger "$(whoami)"
          rt="/run/user/$(id -u)"
          for i in $(seq 1 30); do
            [ -S "${rt}/bus" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=${rt}" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="${rt}" systemctl --user show-environment || \
            echo "::warning::systemd --user session not reachable after enable-linger; the real-systemd tests will report why"

      - name: Test
        env:
          AGENTOP_SYSTEMD_TESTS: ${{ matrix.binary == 'agentop' && 'required' || '' }}
        run: |
          go test -v -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  proxy-init-iptables:
    name: proxy-init iptables rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # This job runs a repo script as root via `sudo -E` and needs no git
          # access afterwards, so don't leave the job token in .git/config.
          persist-credentials: false

      # The harness builds its rules inside `unshare --net`, so it never touches
      # the runner's own networking. It needs root for unshare + iptables, the
      # dummy module to generate a routable external packet, and both iptables
      # backends so the legacy-detection case is exercised rather than skipped.
      - name: Install iptables backends
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables iproute2 kmod
          sudo modprobe dummy || echo "dummy module unavailable; capture packet may not be generated"

      # Gates the interception rules themselves: chain placement and ordering,
      # the DNS carve-out, the non-TCP drop, the fail-closed guards, and — for
      # transparent inbound — that the ambient DNAT precedes AB_REDIRECT's
      # ztunnel-mark RETURN. That ordering decides whether mesh-delivered traffic
      # is validated or waved through, and nothing else in CI covers it.
      - name: Test enforce-redirect + transparent inbound rules
        run: sudo -E deploy/proxy-init/test-enforce-redirect.sh

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest==8.* python-keycloak==5.3.1 pyjwt==2.10.1 pyyaml==6.*
          # tests/test_lineage_propagate_hook.py exercises the lineage kit's MCP
          # context bridge against the SDK's real client transport. Keep mcp on
          # the 1.x line: the bridge exists for 1.x and the module skips on 2.x,
          # so a bump to mcp 2 would silently turn these tests into skips.
          pip install mcp==1.28.1 httpx==0.28.1 anyio==4.15.1 opentelemetry-api==1.42.1

      - name: Run tests
        run: pytest tests/ -v -x --ignore=tests/e2e

  # The SPARC reflection service ships as its own image; its suite lives
  # beside it rather than under tests/. The live-model tests skip without
  # credentials.
  python-test-sparc:
    name: Python Tests (sparc-service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/sparc-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  # install.sh is a curl|sh entry point, so a regression there is a
  # stranger's first experience of Cortex. shellcheck in
  # security-scans.yaml catches syntax, not behaviour — the tag parser
  # returning the OLDEST release shipped past it.
  install-script:
    name: install.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run install.sh tests
        run: sh scripts/install_test.sh

  # install.ps1 is the Windows one-liner (irm | iex), so it gets the same
  # care. The tests install a pinned release into temporary folders with
  # -NoPath, in both shells a Windows user has: Windows PowerShell 5.1
  # (from a local mirror, including a tampered zip that must stop the
  # install) and PowerShell 7 (from GitHub, as the one-liner does).
  install-ps1:
    name: install.ps1 tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # .claude/skills/ has directory names with ':' in them, which NTFS cannot hold: leave
      # .claude/ out, as go-ci-windows does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          sparse-checkout: |
            /*
            !/.claude/
          sparse-checkout-cone-mode: false

      - name: Run install.ps1 tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\install_test.ps1

      - name: Run install.ps1 tests (PowerShell 7)
        shell: pwsh
        run: .\scripts\install_test.ps1

  # release_notes.sh runs once per release, on the tag push, so a regression
  # would otherwise surface as a release page missing its change list.
  release-notes-script:
    name: release_notes.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run release_notes.sh tests
        run: sh scripts/release_notes_test.sh

  # release_promote.sh runs once per stable release, after its smoke tests, so a
  # regression would otherwise surface as a release that never becomes Latest.
  release-promote-script:
    name: release_promote.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run release_promote.sh tests
        run: sh scripts/release_promote_test.sh

  # check-gateway-linkage.sh runs only at release time, so without this job a
  # regression in it would show only on a release.
  gateway-linkage-script:
    name: check-gateway-linkage.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run check-gateway-linkage.sh tests
        run: sh scripts/check-gateway-linkage_test.sh

  # Static checks of the central metrics stack (deploy/central): Prometheus rules and their unit
  # tests, the collector config, the generated dashboards, and the Kustomize render through
  # kubeconform. The live smoke test needs the cluster and is not run here.
  central-stack:
    name: Central metrics stack checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run deploy/central/check.sh
        run: sh deploy/central/check.sh

  # `go mod tidy -diff` on every module in the repo. GOWORK=off so
  # replace directives resolve as they do in build.yaml and
  # release-binaries.yaml.
  go-tidy-check:
    name: Verify module graph is tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: core/go.mod

      - name: Run go mod tidy -diff in every module
        run: |
          set -euo pipefail
          # Percent-encode %, CR, LF for use in workflow commands
          # (both metadata and message halves — CR/LF in the message
          # would end the command and let the next line be interpreted
          # as a new one).
          esc() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e '$!N' -e 's/\n/%0A/g' -e 'ta'; }
          fail=0
          found=0
          while IFS= read -r -d '' go_mod; do
            found=$((found + 1))
            mod=$(dirname "$go_mod")
            mod_esc=$(esc "$mod")
            go_mod_esc=$(esc "$go_mod")
            echo "::group::${mod_esc}"
            if ! (cd "$mod" && go mod tidy -diff); then
              echo "::error file=${go_mod_esc}::go mod tidy would change ${go_mod_esc}; run 'go mod tidy' in ${mod_esc} and commit"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "::error::no go.mod found in the repository"
            exit 1
          fi
          exit $fail
