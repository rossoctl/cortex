mode: proxy-sidecar

listener:
  roles: [forward]
  forward_proxy_addr: "127.0.0.1:47601"
  session_api_addr: "127.0.0.1:47604"

stats:
  address: "127.0.0.1:47602"

pipeline:
  outbound:
    plugins:
      # Order matters: RunResponseFrame dispatches in REVERSE declaration
      # order (see core/pipeline/pipeline.go:196). session-budget reads
      # pctx.Extensions.Inference.TotalTokens, so inference-parser must
      # run first on the response — meaning it must be declared LAST here.
      - name: session-budget
        config:
          redis_url: "redis://localhost:6379"
          max_calls: 2
          max_tokens: 1000000            # effectively unlimited; forces the
                                         # plugin to track tokens in Redis so
                                         # the watch pane shows real spend
          on_exceed: "pause"
          pause_webhook: "http://localhost:9099"
          pause_timeout: "120s"
          pause_timeout_action: "deny"
          pause_grace_period: "1ms"
          session_ttl_seconds: 300
          default_session_fallback: true    # single-workload demo: pool
                                            # sessionless egress into the
                                            # shared 'default' bucket
      - inference-parser
