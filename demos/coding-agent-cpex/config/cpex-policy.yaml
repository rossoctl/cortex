# CPEX policy for the coding-agent demo (CPEX 0.3.0).
#
# Cortex presents the agent's traffic to CPEX in two shapes:
#   - its model calls as `llm` requests (cmf.llm_input), with tool results
#     in custom.tool_results, and the model's replies as `llm` responses
#     (cmf.llm_output), with the tool calls it proposes in custom.tool_calls;
#   - everything else it sends, curl included, as a call to the tool
#     http_egress (cmf.tool_pre_invoke), with args method, host, path, a
#     bounded body excerpt, truncated and content_encoding. A CONNECT
#     carries only method and host.
#
# Every request is authenticated as the developer whose token Cortex holds
# (principal.token_file); the agent never sees it.
#
# Relative paths resolve against the directory cortex runs in (config/).
#
# `# slide:` ... `# end-slide` mark the excerpts demo/policy_slide.py shows.

plugins:
  - name: developer
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      role: user
      header: x-developer-token
      trusted_issuers:
        - issuer: "https://idp.coding-agent-demo.invalid"
          audiences: ["cortex-coding-agent-demo"]
          algorithms: ["RS256"]
          decoding_key:
            kind: pem_file
            path: identity/developer.pub.pem
          leeway_seconds: 60
      claim_mapper: standard

global:
  pdp:
    - kind: cel

routes:
  # The agent's model calls. A secret in a tool result (the agent read a
  # file holding one) taints the session. PPE 0.5.0 cannot taint without
  # denying, so the plugin lists secret_in_tool_result in observe_codes:
  # the deny is recorded and the call goes on to the model.
  - llm: "*"
    authentication: [developer]
    authorization:
      pre_invocation:
        # slide: llm-taint
        - cel:
            expr: >-
              custom.tool_result_count == 0 ||
              !custom.tool_results.exists(k, custom.tool_results[k].content.matches(secret))
            secret: "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}"
            on_deny:
              - "taint(secret, session)"
              - "deny('secret in a tool result', 'secret_in_tool_result')"
        # end-slide
      # The model's reply, before the agent sees it. In a session that read
      # a secret, a proposed tool call that carries one, or sends a secrets
      # file over the network, refuses the whole turn: the agent never runs
      # it. Other tool calls go on to the wire policy below.
      # slide: llm-output
      post_invocation:
        - cel:
            expr: >-
              !('secret' in security.labels) || custom.tool_call_count == 0 ||
              !custom.tool_calls.exists(k, custom.tool_calls[k].arguments.matches(secret) ||
                custom.tool_calls[k].arguments.matches(exfil))
            secret: "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}"
            exfil: "\\b(curl|wget|nc|scp|rsync)\\b.*(\\.env|id_rsa|\\.pem)\\b"
            on_deny: ["deny('tool call would send secret data', 'secret_in_tool_call')"]
      # end-slide

  # Everything else the agent and its tools send.
  - tool: http_egress
    authentication: [developer]
    authorization:
      pre_invocation:
        # The host allowlist a sandbox would otherwise hold. A tunnel is
        # decided on its host; the requests inside it are checked again.
        # slide: egress-allowlist
        - cel:
            expr: "args.host in allowed"
            allowed: ["support.localtest.me", "llm.localtest.me"]
            on_deny: ["deny('host not allowed', 'egress_host_not_allowed')"]
        # end-slide
        # A session that read a secret sends nothing more, however clean.
        # slide: session-tainted
        - cel:
            expr: "args.method == 'CONNECT' || !('secret' in security.labels)"
            on_deny: ["deny('this session read secret data', 'session_tainted_secret')"]
        # end-slide
        # Only what the excerpt shows can be judged: a body past it, or
        # one encoded, is refused.
        # slide: body-checks
        - cel:
            expr: "args.method == 'CONNECT' || (!args.truncated && args.content_encoding in ['', 'identity'])"
            on_deny: ["deny('body cannot be inspected', 'egress_body_uninspectable')"]
        - cel:
            expr: "args.method == 'CONNECT' || !args.body.matches(secret)"
            secret: "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}"
            on_deny: ["deny('secret in request body', 'secret_in_body')"]
        # end-slide
        # Reports go only to the developer's own projects (the teams
        # claim). The support credential could reach either.
        # slide: project-authz
        - cel:
            expr: >-
              args.method == 'CONNECT' || args.host != 'support.localtest.me' ||
              subject.teams.exists(t, args.path.startsWith('/projects/' + t + '/'))
            on_deny: ["deny('project not authorized', 'project_not_authorized')"]
        # end-slide
