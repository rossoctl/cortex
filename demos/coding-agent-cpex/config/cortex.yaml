# Cortex runtime config for the coding-agent demo. run.sh starts the
# demo's own cortex with it, from this directory and with DEMO_DIR and
# DEMO_STATE set. Every listener is on 4770x and loopback, so it never
# touches an installed cortex service on 4760x.
mode: proxy-sidecar
listener:
  roles: [forward]
  bind_loopback_only: true
  forward_proxy_addr: 127.0.0.1:47700
  session_api_addr: 127.0.0.1:47701
  health_addr: 127.0.0.1:47703
  transparent_proxy_addr: 127.0.0.1:47704
stats:
  address: 127.0.0.1:47702
tls_bridge:
  mode: enabled
  ca_dir: "${DEMO_STATE}/cortex-ca"
  generate_ca: true
  # Bridge every host, so cpex sees each request inside a tunnel. The
  # mocks listen on 47710 and 47711.
  passthrough_hosts: []
  ports: [443, 8443, 47710, 47711]
  # The mocks' self-signed CA.
  upstream_ca_bundle: "${DEMO_STATE}/mock-ca/ca.crt"
session:
  # Only the agent's own header names a session; a generic X-Session-Id
  # here would let the agent pick its session. Children of the agent land
  # in its session through the process chain.
  id_headers: [X-Claude-Code-Session-Id]
  client_affinity: false
  process_attribution: "on"
  archive:
    enabled: false
cost_ledger:
  enabled: false
pipeline:
  outbound:
    plugins:
      - inference-parser
      - mcp-parser
      - name: cpex
        config:
          hooks:
            on_request: [cmf.tool_pre_invoke, cmf.llm_input]
            on_response: [cmf.llm_output]
          config_file: "${DEMO_DIR}/config/cpex-policy.yaml"
          fail_open: false
          # Requests no parser claims (the agent's curl) are policy calls to
          # the tool http_egress.
          synthetic_egress: true
          # Taint follows the agent's session, never a header the agent
          # or its children choose.
          session_source: resolved
          # Cortex asserts the developer to CPEX; the agent never holds the
          # token and it is never forwarded.
          principal:
            token_file: "${DEMO_DIR}/config/identity/developer.jwt"
            header: x-developer-token
          # The llm route taints on a secret in a tool result and must not
          # block the turn. See the policy.
          # slide: observe-codes
          observe_codes: [secret_in_tool_result]
          # end-slide
