[package]
name = "cortex-praxis-filters"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
http = "1"
flate2 = "1"
zstd = "0.13"
praxis-proxy-filter = { version = "=0.8.0", default-features = false }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
metrics = "0.24"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
