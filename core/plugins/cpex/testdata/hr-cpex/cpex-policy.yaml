# CPEX runtime config for the HR demo (CPEX 0.3 schema).
#
# DEMO ONLY — points at an in-cluster Keycloak over plaintext http. Do NOT
# use in production without TLS to the IdP. Keycloak resolves to a private
# cluster address, which CPEX's HTTP transport refuses unless the cpex
# plugin sets `private_destinations: true` (see k8s/authbridge.yaml).
#
# The gateway client secret is read from a mounted Secret
# (`client_secret_source.kind: file`, /etc/cpex-secrets), so its value is
# not inlined here.
#
# ── How to read this file ───────────────────────────────────────────
# The `routes:` block at the bottom is the story: one route per tool, each
# spelling out its authentication and ordered authorization steps. Read
# those first. Everything above them is the toolbox the routes pull from:
#
#   plugins:   3 identities (jwt-user, jwt-client, jwt-workload)
#              2 delegators (workday-oauth, github-oauth)
#              1 approval channel (manager-approver)
#   global:    the Cedar and CEL decision points, and the identity headers
#              the engine asserts to the tool
#
# A plugin runs only where a route reaches it (`authentication:`,
# `delegate(...)`, `require_approval(...)`), and every plugin that makes HTTP calls declares
# `perform_http`.
#
# Two things the 0.2.x version did with plugins are now policy and
# Cortex: the PII check is a CEL step on send_email, and the audit trail
# is the Cortex session timeline, where every cpex decision is recorded
# with its violation code.
# ────────────────────────────────────────────────────────────────────

plugins:
  # ── IDENTITY ─────────────────────────────────────────────────────
  # The human user's token (X-User-Token) and the agent's client token
  # (Authorization), both verified against the realm JWKS.

  # User identity. Carries the human's roles, teams and permissions claims.
  - name: jwt-user
    kind: identity/jwt
    hooks: [identity.resolve]
    capabilities: [perform_http]
    on_error: fail
    config:
      role: user
      header: X-User-Token
      trusted_issuers:
        - issuer: "http://keycloak.cpex-demo:8080/realms/cpex-demo"
          audiences: ["cpex-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/certs"
            insecure_http: true   # in-cluster Keycloak, no TLS
          leeway_seconds: 60
      claim_mapper: standard

  # Client identity. Carries the agent's client_id / azp.
  - name: jwt-client
    kind: identity/jwt
    hooks: [identity.resolve]
    capabilities: [perform_http]
    on_error: fail
    config:
      role: client
      header: Authorization
      trusted_issuers:
        - issuer: "http://keycloak.cpex-demo:8080/realms/cpex-demo"
          audiences: ["cpex-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/certs"
            insecure_http: true
          leeway_seconds: 60
      claim_mapper: standard

  # Workload identity. The agent's own SPIFFE JWT-SVID, which the
  # sidecar fetches from SPIRE and presents on X-Workload-Token (the cpex
  # plugin's `workload:` setting). Only get_headcount names it. Without
  # the SPIRE overlay the key fetch fails and only that route denies.
  # SPIRE signs with ES256, and the SVID's audience is the realm issuer
  # because Keycloak takes it as a client assertion.
  - name: jwt-workload
    kind: identity/jwt
    hooks: [identity.resolve]
    capabilities: [perform_http]
    on_error: fail
    config:
      role: caller_workload
      header: X-Workload-Token
      trusted_issuers:
        - issuer: "http://spire-oidc.spire:8443"
          audiences: ["http://keycloak.cpex-demo:8080/realms/cpex-demo"]
          algorithms: ["ES256"]
          decoding_key:
            kind: jwks_url
            url: "http://spire-oidc.spire:8443/keys"
            insecure_http: true   # in-cluster SPIRE, no TLS
          leeway_seconds: 60
      claim_mapper: standard

  # ── DELEGATORS (RFC 8693 token exchange) ─────────────────────────
  # One per downstream audience; a route's delegate(...) step names one.
  #
  # By default CPEX mints the token but does not hand its value back to Cortex,
  # so Cortex refuses to forward a call whose route delegated
  # (cpex.delegation_unavailable) rather than send the caller's own bearer.

  # Workday: the user's token already carries view_ssn etc.; the exchange
  # only changes the audience.
  - name: workday-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    capabilities: [perform_http, read_inbound_credentials, write_delegated_tokens]
    on_error: fail   # a failed exchange must block the call
    config:
      token_endpoint: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/token"
      insecure_http: true
      client_id: "cpex-gateway"
      client_secret_source:
        kind: file
        path: /etc/cpex-secrets/client-secret
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # GitHub: the user's token does NOT carry github permissions. The
  # github-api client's mapper injects them into the minted token's
  # `permissions` claim, so the IdP stays the source of that truth.
  - name: github-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    capabilities: [perform_http, read_inbound_credentials, write_delegated_tokens]
    on_error: fail
    config:
      token_endpoint: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/token"
      insecure_http: true
      client_id: "cpex-gateway"
      client_secret_source:
        kind: file
        path: /etc/cpex-secrets/client-secret
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # ── ELICITATION (human approval over OIDC CIBA) ──────────────────
  # require_approval(...) asks a person through Keycloak's backchannel
  # and polls the token endpoint on each retry. While the person has not
  # answered, the call is suspended, not denied.
  - name: manager-approver
    kind: elicitation/ciba
    hooks: [elicit]
    capabilities: [perform_http]
    on_error: fail
    config:
      backchannel_endpoint: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/ext/ciba/auth"
      token_endpoint: "http://keycloak.cpex-demo:8080/realms/cpex-demo/protocol/openid-connect/token"
      insecure_http: true
      client_id: "cpex-gateway"
      client_secret_source:
        kind: file
        path: /etc/cpex-secrets/client-secret
      scope: openid
      # The approval token must name the person who was asked.
      approver_claim: preferred_username
      default_requested_expiry_seconds: 300

global:
  pdp:
    # CEL backs the PII check on send_email.
    - kind: cel

    # Cedar decides relationships between principal and resource
    # attributes ("engineers can read internal repos"), which flat APL
    # predicates express poorly.
    - kind: cedar-direct
      dialect: cedar
      policy_text: |
        @id("engineering-internal-repos")
        permit(
          principal,
          action == Action::"read",
          resource is Repo
        ) when {
          principal.roles.contains("engineer") &&
          resource.visibility == "internal"
        };

        // Security can read any repo regardless of visibility.
        @id("security-team-any-repo")
        permit(
          principal,
          action == Action::"read",
          resource is Repo
        ) when {
          principal.roles.contains("security")
        };

        // Anything else is denied by Cedar's default.

  # What the engine tells the tool. Each entry removes its header from
  # the request before setting it, so a caller's own x-auth-user-id never
  # reaches hr-mcp. The values are unsigned: the tool trusts them only
  # because nothing between the sidecar and it can set them.
  assertions:
    request:
      headers:
        - name: x-auth-user-id
          from: subject.id
        - name: x-auth-username
          from: claim.preferred_username
        - name: x-auth-roles
          from: subject.roles
          encode: csv
      # The user's raw JWT has done its job once identity is resolved.
      strip:
        - x-user-token

routes:
  # ════════════════════════════════════════════════════════════════
  # WORKDAY · scenarios 01, 02, 03 (and the taint in 08, 09)
  # ════════════════════════════════════════════════════════════════
  # A flat role gate, a token exchange, a session taint, and SSN
  # redaction on both the request and the response.
  - tool: get_compensation
    authentication: [jwt-user, jwt-client]
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation])"
        # Reading compensation marks the session as having touched secret
        # data; send_email checks for it (scenario 08). The label is keyed
        # by the subject and X-Session-Id.
        - "taint(secret, session)"
    args:
      # The key stays; the value becomes "[REDACTED]" for a caller
      # without perm.view_ssn.
      ssn: "str | redact(!perm.view_ssn)"
    result:
      # The tool returns the SSN unasked when include_ssn is set, so the
      # response needs the same guard.
      ssn: "str | redact(!perm.view_ssn)"

  # ════════════════════════════════════════════════════════════════
  # GITHUB · scenarios 04, 05, 06
  # ════════════════════════════════════════════════════════════════
  # Four layers: a cheap APL gate, Cedar on principal × repo, a token
  # exchange, and a check that the IdP granted enough.
  - tool: search_repos
    authentication: [jwt-user, jwt-client]
    authorization:
      pre_invocation:
        - "require(team.engineering | team.security)"
        - cedar:
            action: 'Action::"read"'
            resource:
              type: Repo
              id: ${args.repo_name}
              attributes:
                visibility: ${args.visibility}
        - "delegate(github-oauth, target: github-api, audience: github-api, permissions: [repo:read:internal])"
        # Refuse to forward a token the IdP narrowed below what the call needs.
        - "!(delegation.granted.permissions contains 'repo:read:internal'): deny"

  # ════════════════════════════════════════════════════════════════
  # EMAIL · scenarios 07, 08, 09, 12
  # ════════════════════════════════════════════════════════════════
  # No delegation: the call is forwarded with the asserted identity
  # headers (scenario 12).
  - tool: send_email
    authentication: [jwt-user, jwt-client]
    authorization:
      pre_invocation:
        - "require(perm.email_send)"
        # PII in the subject or body (SSN or card-number shapes). This
        # catches the shapes it names; it is not data-loss prevention.
        - cel:
            expr: >-
              !((has(args.subject) ? args.subject : '') + ' ' + (has(args.body) ? args.body : ''))
              .matches('[0-9]{3}-[0-9]{2}-[0-9]{4}|[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}')
            on_deny: ["deny('PII in email', 'pii.detected')"]
        # A clean body from a session that read compensation is still
        # refused: the session is tainted, not the content.
        - "security.labels contains \"secret\": deny('external email blocked: this session accessed secret data', 'session_tainted_secret')"

  # ════════════════════════════════════════════════════════════════
  # COMPENSATION CHANGE · scenarios 10, 11
  # ════════════════════════════════════════════════════════════════
  # A change of more than $10,000 either way needs the requester's
  # manager (the `manager` claim) to approve. The approval holds only for
  # this requester, route and tool, is spent by the call it lets through,
  # and `scope` re-checks the live amount, so a sign-off cannot be
  # stretched past $25,000. The amount must be a JSON number: a missing
  # or string amount is refused before the threshold is read, so it
  # cannot slip under it. (`float`, not `int`: a JSON number reaches the
  # engine as a float, whole or not. hr-mcp refuses a fraction.)
  - tool: adjust_compensation
    authentication: [jwt-user, jwt-client]
    args:
      amount: "float"
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - "require(exists(args.amount))"
        - when: "args.amount > 10000 | args.amount < -10000"
          do:
            - "require_approval(manager-approver, from: claim.manager, channel: \"ciba\", scope: \"args.amount <= 25000 & args.amount >= -25000\", purpose: \"Approve a compensation adjustment\", timeout: 5m)"

  # ════════════════════════════════════════════════════════════════
  # HEADCOUNT · scenario 13
  # ════════════════════════════════════════════════════════════════
  # The agent acts as itself, with no person behind the call. The route
  # authenticates by the agent's SVID alone (replace_inherited drops the
  # user and client resolvers). `subject: caller_workload` makes the
  # delegator run two legs: the SVID as an RFC 7523 client assertion
  # authenticates the agent's Keycloak client (hr-copilot-agent), and an
  # RFC 8693 exchange scopes that token to workday-api. The agent holds
  # no standing workday-api entitlement.
  #
  # The global assertions describe a person, so this route replaces them
  # and strips the identity headers a caller could send instead.
  - tool: get_headcount
    authentication:
      replace_inherited: true
      steps: [jwt-workload]
    assertions:
      request:
        replace_inherited: true
        strip:
          - x-user-token
          - x-auth-*
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation], subject: caller_workload)"
        - "!delegation.granted: deny"

  # ════════════════════════════════════════════════════════════════
  # READ-ONLY LOOKUPS
  # ════════════════════════════════════════════════════════════════
  # Neither returns a salary or an SSN, but both still need a verified
  # caller.
  - tool: display_compensation
    authentication: [jwt-user, jwt-client]
    authorization:
      pre_invocation:
        - "require(perm.tool_execute)"

  - tool: get_directory
    authentication: [jwt-user, jwt-client]
    authorization:
      pre_invocation:
        - "require(perm.tool_execute)"

  # Every other tool name, including a differently cased spelling of one
  # above, is refused. A tool with no route would otherwise pass with no
  # policy and no authentication.
  - tool: "*"
    authorization:
      pre_invocation:
        - "deny('no policy for this tool', 'tool_unrouted')"
